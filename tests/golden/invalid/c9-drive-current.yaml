# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: invalid/c9-drive-current
description: 驱动器额定电流小于电机额定电流
system:
  id: c9-drive-current
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 30
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d200
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: fail
  checks:
    C9: fail
    others: not_fail
calc: |
  C9: 驱动器 d200 额定 1.6 A < 电机 2.8 A → fail（峰值 5.8 A < 8.5 A 为 warn，fail 优先）
  其余同 valid/m400-r20-d400
