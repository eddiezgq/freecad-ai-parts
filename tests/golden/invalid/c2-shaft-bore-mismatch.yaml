# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: invalid/c2-shaft-bore-mismatch
description: 14 mm 电机轴接 11 mm 输入孔（r14-100）
system:
  id: c2-shaft-bore-mismatch
  requirement:
    output_torque_cont_nm: 5
    output_torque_peak_nm: 20
    output_speed_rpm: 30
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r14-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: fail
  checks:
    C2: fail
    others: not_fail
calc: |
  C2: 轴 14 ≠ 孔 11，且键宽 5 ≠ 4 → fail
  其余：C3 PCD 70 = 70、M5 / 5.5 通过；C4 1.2 × 5 = 6 ≤ 7.8，6 / 65 = 0.092 ≤ 1.27；C5 20 ≤ 28，20 / 65 = 0.308 ≤ 3.82；
  C6 3.82 × 65 = 248.3 > 54 → warn；C7 3000 ≤ 6000、8500、3500；C9、C10 同 valid/m400-r20-d400
