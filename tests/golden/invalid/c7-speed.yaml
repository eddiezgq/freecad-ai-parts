# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: invalid/c7-speed
description: 输出转速需求过高
system:
  id: c7-speed
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 70
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: fail
  checks:
    C7: fail
    others: not_fail
calc: |
  C7: 70 × 100 = 7000 rpm > 电机最高 6000，且 > 减速器最高输入 6500 → fail（同时超过平均输入转速限制 3500，fail 优先）
  其余同 valid/m400-r20-d400
