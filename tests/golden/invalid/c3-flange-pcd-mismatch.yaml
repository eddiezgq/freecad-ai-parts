# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: invalid/c3-flange-pcd-mismatch
description: 电机法兰分度圆 70 mm，减速器输入法兰 63 mm
system:
  id: c3-flange-pcd-mismatch
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 30
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100-pcd63
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: fail
  checks:
    C3: fail
    others: not_fail
calc: |
  C3: PCD 70 vs 63，相差 7 mm > 0.05 mm → fail
  其余同 valid/m400-r20-d400（C6 warn）
