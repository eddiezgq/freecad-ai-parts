# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: invalid/c4-continuous-torque
description: 连续扭矩需求超过减速器额定
system:
  id: c4-continuous-torque
  requirement:
    output_torque_cont_nm: 30
    output_torque_peak_nm: 50
    output_speed_rpm: 30
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: fail
  checks:
    C4: fail
    others: not_fail
calc: |
  C4: 1.2 × 30 = 36 > 减速器额定 34 → fail（电机侧 36 / 70 = 0.514 ≤ 1.27 通过）
  其余同 valid/m400-r20-d400
