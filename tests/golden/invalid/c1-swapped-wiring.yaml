# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: invalid/c1-swapped-wiring
description: 动力线与编码器线接反
system:
  id: c1-swapped-wiring
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 30
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.encoder
  - a: drive.encoder_in
    b: motor.power_in
expected:
  overall: fail
  checks:
    C1: fail
    C9: any
    C10: any
    others: not_fail
calc: |
  C1: drive.motor_out（electrical.motor_power）↔ motor.encoder（signal.encoder）类型不在可连接列表；drive.encoder_in ↔ motor.power_in 同样 → fail
  C9、C10: 正确的动力与编码器连接不存在，结果取决于 M3 对“缺连接”的定义，本用例不断言（any）
