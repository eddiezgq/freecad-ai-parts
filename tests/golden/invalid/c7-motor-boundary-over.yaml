id: invalid/c7-motor-boundary-over
description: 所需电机转速 6001 rpm，略超电机最高转速 6000
system:
  id: c7-motor-boundary-over
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 60.01
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: fail
  checks:
    C7: fail
    others: not_fail
calc: 'C7: 60.01 × 100 = 6001 > 6000 → fail（≤ 减速器 6500；> 平均 3500 为 warn，fail 优先）

