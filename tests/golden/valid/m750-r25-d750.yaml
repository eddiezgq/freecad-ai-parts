# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: valid/m750-r25-d750
description: 750 W 电机 + r25-100 + d750，给出负载惯量
system:
  id: m750-r25-d750
  requirement:
    output_torque_cont_nm: 40
    output_torque_peak_nm: 80
    output_speed_rpm: 20
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
    load_inertia_kgm2: 2.0
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m750
  - instance: reducer
    component: test.reducer.test-vendor.r25-100
  - instance: drive
    component: test.drive.test-vendor.d750
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: warn
  checks:
    C1: pass
    C2: pass
    C3: pass
    C4: pass
    C5: pass
    C6: warn
    C7: pass
    C8: pass
    C9: pass
    C10: pass
calc: |
  C2: 19 h6 带键（6）↔ 19 H7 键连接（6）
  C3: PCD 90、4×通孔 6.6、凸止口 70 ↔ PCD 90、4×M6、凹止口 70；M6 中等系列间隙孔 6.6，6.6 ≥ 6.6
  C4: 1.2 × 40 = 48 ≤ 51；48 / 70 = 0.686 ≤ 2.39
  C5: 80 ≤ 82；80 / 70 = 1.143 ≤ 7.16
  C6: 7.16 × 70 = 501.2 > 147 → warn
  C7: 20 × 100 = 2000 ≤ 6000、≤ 5600、≤ 3500
  C8: (2.0 / 100² + 1.69e-5) / 8.7e-5 = (2.0e-4 + 0.169e-4) / 0.87e-4 = 2.49 ≤ 10
  C9: 220 V 单相在 200–240 V 内；200 = 200；5.5 ≥ 4.7；16.9 ≥ 14.1
  C10: biss_c 支持；ethercat 一致
