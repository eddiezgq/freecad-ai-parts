# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）
id: valid/m200-adapters-r25-d400
description: 200 W 电机经轴套与适配法兰板接 r25-100，唯一全部通过的用例
system:
  id: m200-adapters-r25-d400
  requirement:
    output_torque_cont_nm: 30
    output_torque_peak_nm: 80
    output_speed_rpm: 25
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
    load_inertia_kgm2: 1.0
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m200
  - instance: reducer
    component: test.reducer.test-vendor.r25-100
  - instance: drive
    component: test.drive.test-vendor.d400
  - instance: sleeve
    component: test.adapter.test-vendor.sleeve-11-19
  - instance: plate
    component: test.adapter.test-vendor.plate-70-90
  connections:
  - a: motor.shaft
    b: sleeve.inner
  - a: sleeve.outer
    b: reducer.input_bore
  - a: motor.mount_flange
    b: plate.motor_side
  - a: plate.reducer_side
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: pass
  checks:
    C1: pass
    C2: pass
    C3: pass
    C4: pass
    C5: pass
    C6: pass
    C7: pass
    C8: pass
    C9: pass
    C10: pass
calc: |
  C1: 电机轴(out, rotating) → 轴套内孔(in, rotating)；轴套外圆(out, rotating) → 减速器输入孔(in, rotating)；法兰均为 bidir、stationary
  C2: 11 h6 带键（4）↔ 轴套 11 H7 键连接（4）；轴套外圆 19 h6 带键（6）↔ 减速器 19 H7 键连接（6）
  C3: 电机法兰 PCD 70、通孔 5.5、凸止口 50 ↔ 法兰板电机侧 PCD 70、M5、凹止口 50（5.5 ≥ 5.5）；
      法兰板减速器侧 PCD 90、通孔 6.6、凸止口 70 ↔ 减速器 PCD 90、M6、凹止口 70（6.6 ≥ 6.6）
  C4: 1.2 × 30 = 36 ≤ 51；36 / 70 = 0.514 ≤ 0.64
  C5: 80 ≤ 82；80 / 70 = 1.143 ≤ 1.91
  C6: 1.91 × 70 = 133.7 ≤ 147 → pass
  C7: 25 × 100 = 2500 ≤ 6000、≤ 5600、≤ 3500
  C8: (1.0 / 100² + 1.69e-5) / 1.4e-5 = 1.169e-4 / 0.14e-4 = 8.35 ≤ 10
  C9: 220 V 单相在范围内；200 = 200；2.8 ≥ 1.5；10 ≥ 4.5
  C10: biss_c 支持；ethercat 一致
