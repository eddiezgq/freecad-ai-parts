    output_torque_cont_nm: 40
    output_torque_peak_nm: 80
    output_speed_rpm: 20
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m750
  - instance: reducer
    component: test.reducer.test-vendor.r25-100
  - instance: drive
    component: test.drive.test-vendor.d750
  connections:
  - a: motor.shaft
    b: reducer.input_bore
