# golden 用例草稿：预期结果为人工手算，须由人审定（CLAUDE.md、ADR-0015）；M3 扩充（issue #55），待人逐个确认
id: valid/c7-boundary-equal
description: 所需电机转速刚好等于电机最高转速 6000 rpm
system:
  id: c7-boundary-equal
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 60
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 220
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: warn
  checks:
    C7: warn
    C6: warn
    others: not_fail
calc: 'C7: 60 × 100 = 6000 ≤ 6000（刚好等于）、≤ 6500；但 > 平均输入转速限制 3500 → warn

  其余同 valid/m400-r20-d400：C1–C3、C5、C7、C9、C10 通过；C6 3.82 × 100 × 0.7 = 267.4 > 98 → warn；C8、C11 不适用'
