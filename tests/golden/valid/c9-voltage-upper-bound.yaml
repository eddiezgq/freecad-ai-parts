id: valid/c9-voltage-upper-bound
description: 供电 240 V，刚好等于驱动器输入范围上限
system:
  id: c9-voltage-upper-bound
  requirement:
    output_torque_cont_nm: 25
    output_torque_peak_nm: 50
    output_speed_rpm: 30
    safety_factor: 1.2
    supply:
      current_type: ac
      voltage_v: 240
      phases: 1
    fieldbus_protocol: ethercat
  components:
  - instance: motor
    component: test.servo_motor.test-vendor.m400
  - instance: reducer
    component: test.reducer.test-vendor.r20-100
  - instance: drive
    component: test.drive.test-vendor.d400
  connections:
  - a: motor.shaft
    b: reducer.input_bore
  - a: motor.mount_flange
    b: reducer.motor_flange
  - a: drive.motor_out
    b: motor.power_in
  - a: motor.encoder
    b: drive.encoder_in
expected:
  overall: warn
  checks:
    C9: pass
    C6: warn
    others: not_fail
calc: 'C9: 240 V 在 200–240 V 内（闭区间，刚好等于上限）

