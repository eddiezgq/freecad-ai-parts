# 真实规格书的抽取任务（ADR-0040，issue #124、#125）。规格书须先在 data/sources.yaml 登记。
#
# index：先给规格书建页码索引（每页的表格数与检索词出现情况，不含原文），据此确定 pages
#   - doc: src-...            来源文档 id
#     terms: [型号或参数名…]
#
# jobs：抽取任务；每个目标型号抽取一次，结果写到 data/extracted/<doc>/<型号>.json
#   - doc: src-...
#     category: reducer        servo_motor | reducer | drive | bearing
#     pages: "12-15,20"        只把这些页交给 LLM（原文页码）
#     targets: [型号, …]       按目录中印出的写法

index:
  - doc: src-hd-csg-csf-gear-units
    terms: [CSF-2UH, CSG-2UH, CSF-14-50-2UH, CSF-17-100-2UH, CSF-20-100-2UH, CSF-25-100-2UH, CSF-32-100-2UH,
            Rated Torque, Limit for Repeated Peak Torque, Limit for Momentary Torque, Moment of Inertia,
            Outline Dimensions, Backlash, Lost Motion, Torsional Stiffness, Mass, Table 126-1, Table 127-1, Table 129-1]
  - doc: src-yaskawa-sgm7-rotary-manual
    terms: [SGM7J, SGM7J-A5A, SGM7J-01A, SGM7J-C2A, SGM7J-02A, SGM7J-04A, SGM7J-06A, SGM7J-08A, Rated Output,
            Rated Torque, Instantaneous Maximum Torque, Rated Rotation Speed, Maximum Rotation Speed, Rotor Moment of Inertia,
            Torque Constant, External Dimensions, Approx. mass]
  - doc: src-yaskawa-sgd7s-ethercat-manual
    terms: [SGD7S, R70A, R90A, 1R6A, 2R8A, 3R8A, 5R5A, 7R6A, 120A, Ratings, Maximum Applicable Motor Capacity,
            Continuous Output Current, Instantaneous Maximum Output Current, Main Circuit, Single-phase, External Dimensions,
            Approx. mass, Safety, HWBB, EtherCAT]

jobs:
  # Harmonic Drive CSF-2UH 整机型：额定值表（Table 127-1）、外形尺寸与质量（Table 129-1）、回差与刚度
  - doc: src-hd-csg-csf-gear-units
    category: reducer
    pages: "8-13"
    targets: [CSF-14-50-2UH, CSF-14-100-2UH, CSF-17-50-2UH, CSF-17-100-2UH, CSF-20-50-2UH, CSF-20-100-2UH,
              CSF-25-100-2UH, CSF-32-100-2UH]
  # 安川 Σ-7 SGM7J（第 4 章）：规格、无减速机型的额定值、外形尺寸、轴端
  - doc: src-yaskawa-sgm7-rotary-manual
    category: servo_motor
    pages: "54-55,64-66"
    targets: [SGM7J-A5A, SGM7J-01A, SGM7J-C2A, SGM7J-02A, SGM7J-04A, SGM7J-06A, SGM7J-08A]
  # 安川 Σ-7S EtherCAT 驱动器（200 V）：额定值、规格、外形尺寸与质量
  - doc: src-yaskawa-sgd7s-ethercat-manual
    category: drive
    pages: "62-65,67-70,80-83"
    targets: [SGD7S-R70A, SGD7S-R90A, SGD7S-1R6A, SGD7S-2R8A, SGD7S-3R8A, SGD7S-5R5A, SGD7S-7R6A, SGD7S-120A]
