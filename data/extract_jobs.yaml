# 真实规格书的抽取任务（ADR-0040，issue #124、#125）。规格书须先在 data/sources.yaml 登记。
#
# index：先给规格书建页码索引（每页的表格数与检索词出现情况，不含原文），据此确定 pages
#   - doc: src-...            来源文档 id
#     terms: [型号或参数名…]
#
# jobs：抽取任务；每个目标型号抽取一次，结果写到 data/extracted/<doc>/<型号>.json
#   - doc: src-...
#     category: reducer        servo_motor | reducer | drive | bearing | adapter | linear_module | gripper
#     pages: "12-15,20"        只把这些页交给 LLM（原文页码）
#     targets: [型号, …]       按目录中印出的写法

index:
  - doc: src-hd-csg-csf-gear-units
    terms: [CSF-2UH, CSG-2UH, CSF-14-50-2UH, CSF-17-100-2UH, CSF-20-100-2UH, CSF-25-100-2UH, CSF-32-100-2UH,
            Rated Torque, Limit for Repeated Peak Torque, Limit for Momentary Torque, Moment of Inertia,
            Outline Dimensions, Backlash, Lost Motion, Torsional Stiffness, Mass, Table 126-1, Table 127-1, Table 129-1]
  - doc: src-yaskawa-sgm7-rotary-manual
    terms: [SGM7J, SGM7J-A5A, SGM7J-01A, SGM7J-C2A, SGM7J-02A, SGM7J-04A, SGM7J-06A, SGM7J-08A, Rated Output,
            Rated Torque, Instantaneous Maximum Torque, Rated Rotation Speed, Maximum Rotation Speed, Rotor Moment of Inertia,
            Torque Constant, External Dimensions, Approx. mass]
  - doc: src-yaskawa-sgd7s-ethercat-manual
    terms: [SGD7S, R70A, R90A, 1R6A, 2R8A, 3R8A, 5R5A, 7R6A, 120A, Ratings, Maximum Applicable Motor Capacity,
            Continuous Output Current, Instantaneous Maximum Output Current, Main Circuit, Single-phase, External Dimensions,
            Approx. mass, Safety, HWBB, EtherCAT]
  - doc: src-nsk-e1103c-part-a
    terms: [Table 6.6, Omitted, ISO Normal, Tolerance Class, Bearing Numbers]
  - doc: src-nsk-e1103c-part-c
    terms: [Single-Row Deep Groove Ball Bearings, "6000", "6001", "6200", "6201", "6202", "608", Boundary Dimensions,
            Basic Load Ratings, Limiting Speeds, Abutment and Fillet Dimensions, Mass]

  # 直线模组与抓手（ADR-0127，ADR-0115 44.5.3）
  - doc: src-festo-egc-tb
    terms: [EGC-TB-KF, General technical data, Max. speed, Max. acceleration, Repetition accuracy, Max. feed force,
            Max. working stroke, Feed constant, Fy, Fz, Mx, My, Mz, Basic weight, Additional weight per 10 mm stroke,
            Moving load, Dimensions, B1, H1, L1]
  - doc: src-festo-egc-bs
    terms: [EGC-BS-KF, Technische Daten, Geschwindigkeit, Beschleunigung, Wiederholgenauigkeit, Vorschubkraft,
            Arbeitshub, Spindelsteigung, Fy, Fz, Mx, My, Mz, Grundgewicht, Zusatzgewicht, Bewegte Last, Abmessungen, B1, H1, L1]
  - doc: src-schmalz-sng-m
    terms: [SNG-M, Number of needles, Needle diameter, Needle stroke, Plunge angle, Operating pressure, Weight, Dimensions]
  - doc: src-schmalz-spf
    terms: [SPF, Suction force, Ds, Weight, Dimensions, Technical data]

jobs:
  # Harmonic Drive CSF-2UH 整机型：额定值表（Table 127-1）、外形尺寸与质量（Table 129-1）、回差与刚度
  - doc: src-hd-csg-csf-gear-units
    category: reducer
    pages: "8-13"
    # 整机型的电机侧法兰按所配电机定制，目录只给输入孔（ADR-0045）
    configurable_ports:
      motor_flange: Harmonic Drive CSF-2UH 整机型的电机安装法兰按所配电机定制，目录不规定孔位
    targets: [CSF-14-50-2UH, CSF-14-100-2UH, CSF-17-50-2UH, CSF-17-100-2UH, CSF-20-50-2UH, CSF-20-100-2UH,
              CSF-25-100-2UH, CSF-32-100-2UH]
  # 安川 Σ-7 SGM7J（第 4 章）：型号说明（编码器、轴端选项，ADR-0044）、规格、无减速机型的额定值、外形尺寸、轴端
  - doc: src-yaskawa-sgm7-rotary-manual
    category: servo_motor
    pages: "53-55,64-66"
    targets: [SGM7J-A5A, SGM7J-01A, SGM7J-C2A, SGM7J-02A, SGM7J-04A, SGM7J-06A, SGM7J-08A]
    # 订货选项变体（ADR-0046 第 4 条）：沿用基本型号的数据，随选项变化的项在 confirmed.yaml 中按变体型号确认
    variants:
      - of: SGM7J-A5A
        model: SGM7J-A5A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
      - of: SGM7J-01A
        model: SGM7J-01A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
      - of: SGM7J-C2A
        model: SGM7J-C2A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
      - of: SGM7J-02A
        model: SGM7J-02A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
      - of: SGM7J-04A
        model: SGM7J-04A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
      - of: SGM7J-06A
        model: SGM7J-06A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
      - of: SGM7J-08A
        model: SGM7J-08A（轴端代码 6）
        basis: 第 53 页型号说明“6 Straight with key and tap”；键槽尺寸第 66 页
  # 安川 Σ-7S EtherCAT 驱动器（200 V）：额定值、规格、外形尺寸与质量、安装孔尺寸（第 90 页）
  - doc: src-yaskawa-sgd7s-ethercat-manual
    category: drive
    pages: "62-65,67-70,80-83,90"
    targets: [SGD7S-R70A, SGD7S-R90A, SGD7S-1R6A, SGD7S-2R8A, SGD7S-3R8A, SGD7S-5R5A, SGD7S-7R6A, SGD7S-120A]
  # NSK E1103c Part C 单列深沟球轴承表（第 11 页起，按内径分页）：示范缝纫机企业与上轴设计用（ADR-0099 41.6、ADR-0100）
  - doc: src-nsk-e1103c-part-c
    category: bearing
    pages: "11-12"
    targets: ["6000", "6001", "6200", "6201", "6202"]
  # 60 系列内径 40–55 mm：机器人关节空心轴（ADR-0100 42.5，对照《机械设计》33.10 的 6010 一对）
  - doc: src-nsk-e1103c-part-c
    category: bearing
    pages: "13-14"
    targets: ["6008", "6009", "6010", "6011"]
  # 施迈茨针刺抓手 SNG-M（ADR-0127）：数据表 3 页，不给保持力（不写，抓取力校核判待确认）
  - doc: src-schmalz-sng-m
    category: gripper
    pages: "1-3"
    targets: [SNG-M 4 0.8]
  # 施迈茨平吸盘 SPF：吸力是 -0.6 bar 真空下的理论值、不含安全系数（写进 condition）；对透气的布料不适用（选型时判待确认）
  - doc: src-schmalz-spf
    category: gripper
    pages: "1-6"
    targets: [SPF 10, SPF 15, SPF 20, SPF 25, SPF 30, SPF 40, SPF 50, SPF 60]
