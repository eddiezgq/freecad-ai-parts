teaching:
  principle: 四根杆用四个转动副连成封闭环：最短杆 + 最长杆 ≤ 另两杆之和（格拉霍夫条件）且最短杆是曲柄时，曲柄整周转动、摇杆往复摆动。连杆上的点画出各种连杆曲线，可用来实现给定轨迹。
