teaching:
  principle: 凸轮转一圈，轮廓推动从动件按规定的规律升起、停留、回落、停留。先定从动件运动规律（这里推程、回程都用余弦加速度规律），再按“反转法”求出凸轮轮廓：理论轮廓是滚子中心的轨迹，实际轮廓向内偏移一个滚子半径。
