teaching:
  principle: 拨盘匀速转动，拨销进入槽轮的径向槽时带着槽轮转过 360°/n，拨销离开后，拨盘上的锁止弧卡住槽轮让它停住。中心距 C = R / sin(π/n)，拨销进出槽时方向沿槽，没有刚性冲击；运动时间只占一圈的
    (n − 2)/(2n)。
