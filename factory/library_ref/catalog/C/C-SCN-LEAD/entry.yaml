teaching:
  principle: 丝杠转动、螺母（滑台）不转只沿导轨移动，丝杠每转一圈螺母移动一个导程：把旋转变成直线移动。梯形螺纹的导程角小于当量摩擦角时能自锁（推螺母转不动丝杠），所以常用于需要停住的升降、调节。
  uses:
  - 机床手动进给、台钳
  - 升降台、千斤顶
  - 直线模组（与滚珠丝杠对比）
