teaching:
  principle: 两对外啮合直齿轮串联：总传动比等于各级从动轮齿数积除以主动轮齿数积，i = (z2·z4)/(z1·z3)；每经过一对外啮合转向反一次。齿形是渐开线，中心距
    a = m(z1 + z2)/2。
