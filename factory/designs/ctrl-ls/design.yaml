# 平缝机控制器 CTRL-LS 的设计描述（问渠电子 wqeda.design/1；第 159 轮）。
# spec 规格 → blocks 功能块（计算器出计算书：python3 -m wqeda.calcbook）→ circuit 电路（159d1：生成器展开原理图）→ board 板子（159d2）。
# 示例设计，未经硬件验证，不能直接投产。器件为示例选型（factory/designs/ctrl-ls/parts.yaml，都在立创核实过型号）。
format: wqeda.design/1
name: CTRL-LS
rev: A
title: 平缝机控制器（单相 110–250 V，功率因数校正 + 智能功率模块）
notice: 示例设计，未经硬件验证，不能直接投产。器件为示例选型。
spec:
  example_values: true
  notes:
  - 架构照第 138 轮 GC（Eddie 11-10 定）；额定值第一遍见 docs/设计/WQ-LS/GC/控制器方案与选型.md
  - 效率、功率因数、电控箱内环境温度、负载电流、线圈参数是假设或示例值，计算书里逐行标明；器件参数一律来自 eda/parts/ 的规格书
  - derating 是降额与余量规则，示例值；企业按自己的设计规范填
  vin_min_vac: 90
  vin_max_vac: 250
  line_tolerance: 0.10
  f_line_min_hz: 50
  bus_voltage_v: 390
  motor_power_w: 550
  speed_max_rpm: 5000
  bemf_ll_peak_max_v: 300
  torque_peak_nm: 3.0
  torque_rms_nm: 0.58
  torque_source: 第 138 轮 G2（峰值 ≥ 3 N·m）与 gc_sim（速度环 40 Hz 时力矩均方根 0.58 N·m）
  eta_motor: 0.90
  eta_inverter: 0.97
  eta_pfc: 0.95
  power_factor: 0.99
  aux_power_w: 40
  c_bus_f: 0.00099
  vcc_aux_v: 15
  v24: 24
  ambient_c: 50
  tj_margin_c: 25
  tc_ipm_max_c: 100
  target_factory: null
  acceptance_class: null
  derating:
    capacitor: 1.25
    diode: 1.25
    mosfet: 1.25
    sense_headroom: 1.05
    fuse: 1.25
blocks:
- key: mains
  name: 交流输入、浪涌与整流
  name_en: AC input, inrush and rectifier
  units:
  - type: ac_input
    params: {fuse: 0215010.MXP, ntc: B57364S0259M000, mov: B72214S0271K101, x_cap: BFC233920474, relay: G5LE-1-E DC12,
             cmc: FC-HLF2018-15mH-10A-LF}
  - type: bridge
    params: {bridge: GBU1006, ntc: B57364S0259M000}
- key: pfc
  name: 功率因数校正与母线
  name_en: PFC and DC bus
  units:
  - type: pfc_boost
    params: {controller: ICE3PCS01G, fet: IPW60R060P7, diode: C3D06060A, cap: 500MXH330MEFCSN30X50, n_caps: 3, f_sw: 65000,
             ripple_ratio: 0.3, pcl_margin: 1.2, r_shunt: 10m, v_holdup_min: 300, r_vs_bottom: 20k, dv_bus_max: 20, t_hold_min_s: 0.02}
- key: aux
  name: 辅助电源
  name_en: Auxiliary supply
  units:
  - type: flyback_aux
    params:
      ic: TOP266KG
      out_diode: ES3D
      outputs:
      - {name: 24 V（电磁铁、步进、照明，平均）, v: 24, i: 0.8}
      - {name: 15 V（功率模块、校正控制器、继电器）, v: 15, i: 0.15}
      - {name: 5 V（主控、编码器、面板口）, v: 5, i: 0.3}
      eta: 0.80
      v_or: 100
      f_sw: 66000
      vf_out: 0.95
      v_clamp: 150
      clamp_ratio_min: 1.4
      ilim_margin: 1.2
- key: servo
  name: 主轴伺服逆变与电流采样
  name_en: Spindle servo inverter and current sensing
  units:
  - type: ipm_inverter
    params: {ipm: STGIPS14K60T, f_pwm: 16000, m_index: 0.9, cos_phi: 0.9, t_dead: 1.0e-6}
  - type: low_side_sense
    params: {shunt: WSLT2512R0250FEA, ipm: STGIPS14K60T, gain: 8, v_ref: 3.3, i_trip: 7.5, r_in: 1000, r_bias: 15000}
- key: act
  name: 电磁铁与步进
  name_en: Solenoids and stepper
  units:
  - type: solenoid_drive
    params: {fet: BSC040N08NS5, tvs: SMBJ24A, diode: ES3D, v24_tol: 0.1, coil_r: 8, coil_l: 0.02, t_off_max: 0.003,
             channels: [[剪线, SOL_TRIM], [拨线, SOL_WIPE], [倒缝, SOL_REV], [抬压脚, SOL_FOOT]]}
  - type: stepper
    params: {driver: TMC2226-SA, v24_tol: 0.1, i_coil_rms: 1.0}
- key: io
  name: 主控与传感器输入
  name_en: MCU and sensor inputs
  units:
  - type: mcu_core
    params:
      mcu: STM32G431CBT6
      mcu_note: 主控（沿用关节驱动板）：TIM1 三相互补 PWM、片内运放采三相电流、ADC 测母线与模块温度、TIM4 编码器、USART2 面板口、TIM3 步进脉冲
      # 引脚分配（固件 159f 按 STM32G431 数据手册的复用功能表核对）
      pin_map:
        '1': +3V3
        '2': HALL_U_F
        '3': HALL_V_F
        '4': HALL_W_F
        '5': OSC_IN
        '6': OSC_OUT
        '7': NRST
        '8': VBUS_SNS
        '9': ISNS_U
        '10': PNL_TX
        '11': PNL_RX
        '12': IPM_T
        '13': SOL_TRIM
        '14': ENC_Z_F
        '15': ISNS_V
        '16': ISNS_W
        '17': PEDAL
        '18': STP_DIAG
        '19': GND
        '20': +3V3
        '21': +3V3
        '22': PNL_DE_NC
        '23': GND
        '24': +3V3
        '25': STP_EN
        '26': IPM_SD
        '27': PWM_UL
        '28': PWM_VL
        '29': PWM_WL
        '30': PWM_UH
        '31': PWM_VH
        '32': PWM_WH
        '33': SOL_WIPE
        '34': SOL_REV
        '35': GND
        '36': +3V3
        '37': SWDIO
        '38': SWCLK
        '39': SOL_FOOT
        '40': VB_OK_SNS
        '41': STP_STEP
        '42': STP_DIR
        '43': ENC_A_F
        '44': ENC_B_F
        '45': BOOT0
        '46': PFC_OFF
        '47': GND
        '48': +3V3
      xtal: 8MHz
      c_load: 10p
      required_nets: [ISNS_U, ISNS_V, ISNS_W, VBUS_SNS, IPM_SD, IPM_T, PWM_UH, PWM_UL, PWM_VH, PWM_VL, PWM_WH, PWM_WL, SWDIO, SWCLK, NRST]
  - type: sensor_inputs
    params: {r_pullup: 2200, r_filter: 1000, c_filter: 2.2e-10, encoder_lines: 2500, fc_margin: 2.0, pedal_v_max: 4.5}
- key: comm
  name: 面板口
  name_en: Panel port
  units:
  - type: panel_iso
    params: {isolator: ADUM1201ARZ-RL7, dcdc: B0505S-1WR2, baud: 115200, iso_need_v: 1500}
- key: thermal
  name: 散热
  name_en: Heatsink
  units:
  - type: heatsink
    params: {r_cs: 0.5, r_sa_selected: 0.9}
circuit:
  generate: [ac_input, bridge, pfc_boost, flyback_aux, ipm_inverter, low_side_sense, solenoid_drive, stepper, mcu_core, sensor_inputs,
             panel_iso]
  parts:
  # VB_OK（5 V）分压给主控看（3.3 V 引脚）
  - {ref: R801, lib: 'Device:R', value: 10k, fp: 'Resistor_SMD:R_0603_1608Metric', block: io, pins: {'1': VB_OK, '2': VB_OK_SNS},
     item: RES-0603, note: VB_OK 5 V → 3.3 V}
  - {ref: R802, lib: 'Device:R', value: 20k, fp: 'Resistor_SMD:R_0603_1608Metric', block: io, pins: {'1': VB_OK_SNS, '2': GND},
     item: RES-0603, note: ''}
  footprints: {}
  nets:
    nc: [PNL_DE_NC]
    power: [+24V, +15V, +5V, +3V3, GND, VBUS, +5V_ISO, +3V3_ISO, GND_ISO]
board:
  outline_mm: [200, 140]
  layers: 2
