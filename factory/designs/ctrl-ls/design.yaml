# 平缝机控制器 CTRL-LS 的设计描述（问渠电子 wqeda.design/1；第 159 轮）。
# spec 规格 → blocks 功能块（计算器出计算书：python3 -m wqeda.calcbook）→ circuit 电路（159d1：生成器展开原理图）→ board 板子（159d2）。
# 示例设计，未经硬件验证，不能直接投产。器件为示例选型（factory/designs/ctrl-ls/parts.yaml，都在立创核实过型号）。
format: wqeda.design/1
name: CTRL-LS
rev: A
title: 平缝机控制器（单相 110–250 V，功率因数校正 + 智能功率模块）
notice: 示例设计，未经硬件验证，不能直接投产。器件为示例选型。
spec:
  example_values: true
  notes:
  - 架构照第 138 轮 GC（Eddie 11-10 定）；额定值第一遍见 docs/设计/WQ-LS/GC/控制器方案与选型.md
  - 效率、功率因数、电控箱内环境温度、负载电流、线圈参数是假设或示例值，计算书里逐行标明；器件参数一律来自 eda/parts/ 的规格书
  - derating 是降额与余量规则，示例值；企业按自己的设计规范填
  vin_min_vac: 90
  vin_max_vac: 250
  line_tolerance: 0.10
  f_line_min_hz: 50
  bus_voltage_v: 390
  motor_power_w: 550
  speed_max_rpm: 5000
  bemf_ll_peak_max_v: 300
  torque_peak_nm: 3.0
  torque_rms_nm: 0.58
  torque_source: 第 138 轮 G2（峰值 ≥ 3 N·m）与 gc_sim（速度环 40 Hz 时力矩均方根 0.58 N·m）
  eta_motor: 0.90
  eta_inverter: 0.97
  eta_pfc: 0.95
  power_factor: 0.99
  aux_power_w: 40
  c_bus_f: 0.00099
  vcc_aux_v: 15
  v24: 24
  ambient_c: 50
  tj_margin_c: 25
  tc_ipm_max_c: 100
  # 159d2b：定制磁性元件按理论选磁芯（面积积法）的教材取值：铁氧体 N87 峰值磁密留余量、电流密度、窗口利用系数
  magnetics: {b_max: 0.3, j: 4000000, ku: 0.4, source: 'McLyman《变压器与电感器设计手册》、Erickson《电力电子学基础》第 14 章的常用取值（按理论）'}
  target_factory: null
  acceptance_class: null
  derating:
    capacitor: 1.25
    diode: 1.25
    mosfet: 1.25
    sense_headroom: 1.05
    fuse: 1.25
blocks:
- key: mains
  name: 交流输入、浪涌与整流
  name_en: AC input, inrush and rectifier
  units:
  - type: ac_input
    params: {fuse: 0215010.MXP, ntc: B57364S0259M000, mov: B72214S0271K101, x_cap: BFC233920474, relay: G5LE-1-E DC12,
             cmc: 8118-RC, relay_coil_v: 12}
  - type: bridge
    params: {bridge: GBU1006, ntc: B57364S0259M000}
- key: pfc
  name: 功率因数校正与母线
  name_en: PFC and DC bus
  units:
  - type: pfc_boost
    params: {controller: ICE3PCS01G, fet: IPW60R060P7, diode: C3D06060A, cap: 500MXH330MEFCSN30X50, n_caps: 3, f_sw: 65000,
             ripple_ratio: 0.3, pcl_margin: 1.2, core: ETD59-N87, r_shunt: 10m, v_holdup_min: 300, r_vs_bottom: 20k, dv_bus_max: 20, t_hold_min_s: 0.02}
- key: aux
  name: 辅助电源
  name_en: Auxiliary supply
  units:
  - type: flyback_aux
    params:
      ic: TOP266KG
      out_diode: ES3D
      outputs:
      - {name: 24 V（电磁铁、步进、照明，平均）, v: 24, i: 0.8}
      - {name: 15 V（功率模块、校正控制器、继电器）, v: 15, i: 0.15}
      - {name: 5 V（主控、编码器、面板口）, v: 5, i: 0.3}
      eta: 0.80
      v_or: 100
      f_sw: 66000
      vf_out: 0.95
      v_clamp: 150
      clamp_ratio_min: 1.4
      ilim_margin: 1.2
      core: ETD29-N87
      ku: 0.25          # 多绕组反激：层间绝缘、挡墙占窗口，K_u 取小（教材取值）
      llk_ratio: 0.02   # 漏感占初级电感 2 %（按理论：教材经验值 1–3 %）
- key: servo
  name: 主轴伺服逆变与电流采样
  name_en: Spindle servo inverter and current sensing
  units:
  - type: ipm_inverter
    params: {ipm: STGIPS14K60T, f_pwm: 16000, m_index: 0.9, cos_phi: 0.9, t_dead: 1.0e-6}
  - type: low_side_sense
    params: {shunt: WSLT2512R0250FEA, ipm: STGIPS14K60T, gain: 8, v_ref: 3.3, i_trip: 7.5, r_in: 1000, r_bias: 15000,
             mcu: STM32G431CBT6}
- key: act
  name: 电磁铁与步进
  name_en: Solenoids and stepper
  units:
  - type: solenoid_drive
    params: {fet: BSC040N08NS5, tvs: SMBJ24A, diode: ES3D, v24_tol: 0.1, coil_r: 8, coil_l: 0.02, t_off_max: 0.003,
             channels: [[剪线, SOL_TRIM], [拨线, SOL_WIPE], [倒缝, SOL_REV], [抬压脚, SOL_FOOT]]}
  - type: stepper
    params: {driver: TMC2226-SA, v24_tol: 0.1, i_coil_rms: 1.0, r_sense: 0.12, r_vref_top: 22000, r_vref_bot: 10000, v_5vout: 5.0}
- key: io
  name: 主控与传感器输入
  name_en: MCU and sensor inputs
  units:
  - type: mcu_core
    params:
      mcu: STM32G431CBT6
      mcu_note: 主控（沿用关节驱动板）：TIM1 三相互补 PWM、片内运放采三相电流、ADC 测母线与模块温度、TIM4 编码器、USART2 面板口、TIM3 步进脉冲
      # 引脚分配（固件 159f 按 STM32G431 数据手册的复用功能表核对）
      pin_map:
        '1': +3V3
        '2': HALL_U_F
        '3': HALL_V_F
        '4': HALL_W_F
        '5': OSC_IN
        '6': OSC_OUT
        '7': NRST
        '8': VBUS_SNS
        '9': ISNS_U
        '10': PNL_TX
        '11': PNL_RX
        '12': IPM_T
        '13': SOL_TRIM
        '14': ENC_Z_F
        '15': ISNS_V
        '16': ISNS_W
        '17': PEDAL
        '18': STP_DIAG
        '19': GND
        '20': +3V3
        '21': +3V3
        '22': PNL_DE_NC
        '23': GND
        '24': +3V3
        '25': STP_EN
        '26': IPM_SD
        '27': PWM_UL
        '28': PWM_VL
        '29': PWM_WL
        '30': PWM_UH
        '31': PWM_VH
        '32': PWM_WH
        '33': SOL_WIPE
        '34': SOL_REV
        '35': GND
        '36': +3V3
        '37': SWDIO
        '38': SWCLK
        '39': SOL_FOOT
        '40': VB_OK_SNS
        '41': STP_STEP
        '42': STP_DIR
        '43': ENC_A_F
        '44': ENC_B_F
        '45': BOOT0
        '46': PFC_OFF
        '47': GND
        '48': +3V3
      xtal: 8MHz
      c_load: 10p
      required_nets: [ISNS_U, ISNS_V, ISNS_W, VBUS_SNS, IPM_SD, IPM_T, PWM_UH, PWM_UL, PWM_VH, PWM_VL, PWM_WH, PWM_WL, SWDIO, SWCLK, NRST]
  - type: sensor_inputs
    params: {r_pullup: 2200, r_filter: 1000, c_filter: 2.2e-10, encoder_lines: 2500, fc_margin: 2.0, pedal_v_max: 4.5}
- key: comm
  name: 面板口
  name_en: Panel port
  units:
  - type: panel_iso
    params: {isolator: ADUM1201ARZ-RL7, dcdc: B0505S-1WR2, baud: 115200, iso_need_v: 1500}
- key: thermal
  name: 散热
  name_en: Heatsink
  units:
  - type: heatsink
    params: {r_cs: 0.5, r_sa_selected: 0.9}
circuit:
  generate: [ac_input, bridge, pfc_boost, flyback_aux, ipm_inverter, low_side_sense, solenoid_drive, stepper, mcu_core, sensor_inputs,
             panel_iso]
  parts:
  # VB_OK（5 V）分压给主控看（3.3 V 引脚）
  - {ref: R801, lib: 'Device:R', value: 10k, fp: 'Resistor_SMD:R_0603_1608Metric', block: io, pins: {'1': VB_OK, '2': VB_OK_SNS},
     item: RES-0603, note: VB_OK 5 V → 3.3 V}
  - {ref: R802, lib: 'Device:R', value: 20k, fp: 'Resistor_SMD:R_0603_1608Metric', block: io, pins: {'1': VB_OK_SNS, '2': GND},
     item: RES-0603, note: ''}
  footprints: {}
  nets:
    nc: [PNL_DE_NC]
    power: [+24V, +15V, +5V, +3V3, GND, VBUS, +5V_ISO, +3V3_ISO, GND_ISO]
board:
  outline_mm: [250, 150]   # 电控箱内腔 254 × 154 mm（第 62 轮模型）
  layers: 4
  # 159d2b：安装孔接保护地 PE（板子装在电控箱上，箱体接地）；布线的线宽 / 间距分类。
  # 间距是布线器用的数（示例值）；安全距离（电气间隙、爬电距离）按 ctrl-ls/safety.yaml 的规则另查。
  # 159d2b 第一次：高压类间距 2.0–2.5 mm、自举线也放在里面时 Freerouting 30 分钟走不完一遍（功率模块脚距只有 2.35 mm），
  # 自举线单独一类后再试；安全距离另由检查把关
  holes: [[5, 28], [245, 28], [5, 145], [245, 145]]   # H1 接 PE（Y 电容经它接箱体），其余安装孔不在板上连线
  # 母线（390 V）铺在底层：散热器边的升压二极管、母线电容、功率模块 P 脚之间加宽电流通路（布完线再铺，母线本身按走线布通）
  pours:
  - {net: VBUS, layer: B.Cu, points: [[110, 1], [236, 1], [236, 9], [248, 9], [248, 68], [110, 68]]}
  # 布线间距分两层（159d2b 第九次布线起）：每个分类自己的间距小（同组网络之间：分压电阻一串、功率模块相邻脚），
  # 组和组之间要多大写在 class_pairs 里——只给一个分类整体设大间距时，它自己的电阻两脚（1206 脚间 1.6 mm）都“违规”，布线器接不上
  # （第八次 59 处没连上大多是这个）。真正的安全要求由安全距离检查（safety.yaml）按铜间距量，这里的数比它略大一点留余量
  net_classes:
  - {name: AC_L, track_mm: 2.5, route_mm: 1.2, clearance_mm: 0.5, nets: [L_IN, L_F, L_C, L_R], layers: [F.Cu, B.Cu]}
  - {name: AC_N, track_mm: 2.5, route_mm: 1.2, clearance_mm: 0.5, nets: [N_IN, N_C], layers: [F.Cu, B.Cu]}
  - {name: PE, track_mm: 1.5, clearance_mm: 0.5, nets: [PE], layers: [F.Cu, B.Cu]}
  - {name: HV, track_mm: 2.0, route_mm: 1.2, clearance_mm: 0.5, nets: [VBUS, VRECT, SW_PFC, MOT_U, MOT_V, MOT_W], layers: [F.Cu, B.Cu]}
  - {name: HVSig, track_mm: 0.5, clearance_mm: 0.5, nets: [XDIS, BRO_A, BRO_B, TOP_V1, FLY_D, CLAMP, CLAMP_M, VSENSE_1, VSENSE_2,
                                                       OVP_1, OVP_2, VBUS_SNS_1, VBUS_SNS_2],
     layers: [F.Cu, B.Cu]}
  # 自举电容的两根线（上桥浮地，跟着电机相线跳到 390 V）：模块脚距 2.35 mm，同组之间 0.5
  - {name: Boot, track_mm: 0.5, clearance_mm: 0.5, nets: [OUT_U, OUT_V, OUT_W, VB_U, VB_V, VB_W], layers: [F.Cu, B.Cu]}
  # 整流桥负端到采样电阻：电流大但电位贴着地（弱电一侧）
  - {name: Return, track_mm: 2.0, route_mm: 1.2, clearance_mm: 0.3, nets: [RECT_N], layers: [F.Cu, B.Cu]}
  # 功率模块下桥采样端（电流大、电位贴着地）；单列是因为它们和电机相线在模块上相邻（脚间 1.7 mm）
  - {name: Shunt, track_mm: 1.0, clearance_mm: 0.3, nets: [N_U, N_V, N_W], layers: [F.Cu, In2.Cu, B.Cu]}
  # 功率模块的输入脚、15 V：和自举脚在模块上相邻，单列（只在模块旁边按引脚间距放宽，见 route_fit）
  - {name: IpmIn, track_mm: 0.3, clearance_mm: 0.2, nets: [IN_UH, IN_UL, IN_VH, IN_VL, IN_WH, IN_WL], layers: [F.Cu, In2.Cu, B.Cu]}
  - {name: Vcc15, track_mm: 0.6, route_mm: 0.4, clearance_mm: 0.2, nets: [+15V, FLY_15], layers: [F.Cu, In2.Cu, B.Cu]}
  # 步进驱动 HTSSOP 脚距 0.65 mm（焊盘 0.4）：布线先用 0.3 mm 进脚，布完加宽
  - {name: Power, track_mm: 1.0, route_mm: 0.3, clearance_mm: 0.2, nets: [+24V, SOL1_D, SOL2_D, SOL3_D, SOL4_D, SOL1_K, SOL2_K,
                                                       SOL3_K, SOL4_K, STP_OA1, STP_OA2, STP_OB1, STP_OB2, FLY_24, FLY_5, +5V],
     layers: [F.Cu, In2.Cu, B.Cu]}
  - {name: Ground, track_mm: 0.4, route_mm: 0.25, clearance_mm: 0.2, nets: [GND, GND_ISO]}
  # 组和组之间的布线间距（Default = 其余网络）；安全距离规则（safety.yaml 示例值）：相线↔零线 2.5、高压↔弱电 2.0、保护地 4.0
  class_pairs:
  - {a: [AC_L], b: [AC_N], clearance_mm: 2.6}
  - {a: [AC_L, AC_N], b: [HV, HVSig, Boot], clearance_mm: 1.4}
  - {a: [AC_L, AC_N, HV, HVSig, Boot], b: [Return, Shunt, IpmIn, Vcc15, Power, Ground, Default], clearance_mm: 2.2}
  - {a: [PE], b: [AC_L, AC_N, HV, HVSig, Boot, Return, Shunt, IpmIn, Vcc15, Power, Ground, Default], clearance_mm: 4.2}
