# 关节伺服驱动板 DRV-JOINT 的设计描述（问渠电子 wqeda.design/1；第 102 轮由 drv_joint.py 迁来，第 104 轮改成功能块单元 + 生成器）
# 四层：spec 规格 → blocks 功能块 → circuit 电路 → board 板子。KiCad 工程和全部产物由 factory/designs/tools/build.py 从这里生成。
# 改设计改这个文件，然后本机跑 build.py 重新生成再提交（CI 核对产物一致）。示例设计，未经硬件验证，不能直接投产。
format: wqeda.design/1
name: DRV-JOINT
rev: A
title: null
notice: 示例设计，未经硬件验证，不能直接投产。器件为示例选型（KiCad 官方库里有的器件，引脚取自库）。
spec:
  example_values: true
  bus_voltage_v: 48.0
  phase_current_a: 8.5
  motor_power_w: 400.0
  target_factory: null
  acceptance_class: null
  notes:
  - 数值与数字工厂电路分析 cae/circuit.py 的例题同一组数，测试核对
  - 目标工厂、验收等级（IPC-A-610 第几级）未定
  - derating 是降额与余量规则，示例值；企业按自己的设计规范填
  phase_current_peak_a: 29.73
  current_source: cae/motors.py 伺服 400 W：额定 1.27 N·m、峰值 4.46 N·m ÷ 力矩常数 0.15 N·m/A（示例）
  derating:
    capacitor: 1.25
    diode: 1.25
    mosfet: 1.25
    sense_headroom: 1.05
blocks:
- key: power
  name: 48 V 输入与母线
  name_en: 48 V input and DC bus
  units:
  - type: bus_input
    params:
      C_BUS_UF: 470.0
      c_bus_v: 63
      r_div_bottom: 6.8k
      v_adc_target: 3.0
      v_adc_fs: 3.3
      c_filter: 10n
  notes:
  - 母线 48 V（示例）
  - 母线电容 470 μF / 63 V（电路分析例题 3）；每个半桥旁 2.2 μF / 100 V 陶瓷电容就近吸收开关电流
  - 母线电压检测：(51 k + 51 k) / 6.8 k 分压，48 V → 3.0 V，满量程 52.8 V
- key: aux
  name: 辅助电源 12 / 5 / 3.3 V
  name_en: Auxiliary supplies
  units:
  - type: aux_supply
    params:
      v_out: 12.0
      f_sw_mhz: 2.1
      ripple_ratio: 0.3
      i_out_a: 0.6
      v_ref: 0.765
      v_ref_source: LMR16006 规格书 V_FB 典型值（eda/parts/LMR16006YQ.yaml，待核对）
      r_fb_bottom: 10k
      c_in: 2.2u/100V
      d_freewheel: 60V 1A
      c_out: 22u/25V
  notes:
  - 12 V：LMR16006Y 降压，L = (Vin−Vo)·Vo/(Vin·f·ΔI)，f = 2.1 MHz、ΔI = 0.3 × 0.6 A → 23.8 μH，取 22 μH
  - 反馈 Vo = Vref·(1 + Rt/Rb)，Vref 0.765 V（按器件手册，选型时核对）、Rb 10 kΩ → Rt = 147 kΩ
- key: bridge
  name: 三相桥
  name_en: Three-phase bridge
  units:
  - type: half_bridge
    params:
      phases: [A, B, C]
      fet: BSC040N08NS5
      fet_lib: Transistor_FET:BSC040N08NS5
      fet_fp: Package_TO_SOT_SMD:TDSON-8-1
      fet_item: MOS-80V
      c_snub: 2.2u/100V
  notes: [MOSFET BSC040N08NS5 × 6（示例选型）]
- key: gate
  name: 栅极驱动
  name_en: Gate drivers
  units:
  - type: gate_drive
    params:
      RG_OHM: 10.0
      VDRV: 12.0
      driver: IR2101S
      d_boot: 100V 1A
      c_boot: 1u/25V
      c_vcc: 1u/25V
  notes: [驱动 12 V，栅极电阻 10 Ω（电路分析例题 2）；死区由 MCU 定时器给（约 200 ns，示例）]
- key: sense
  name: 相电流采样与电机输出
  name_en: Phase current sensing
  units:
  - type: current_sense
    params:
      RS_MOHM: 2.0
      GAIN: 20.0
      shunt_tol: 1%
      amp: INA240A1D
      c_aa: 1n
      v_adc_fs: 3.3
      gbw_mhz: 10.0
  notes:
  - 额定相电流 ≈ 8.5 A（400 W 伺服电机额定力矩 1.27 N·m ÷ 力矩常数 0.15 N·m/A，示例）
  - 采样电阻 2 mΩ × 放大 20 倍（INA240A1 的固定增益）= 40 mV/A，零点 1.65 V，量程 ±41 A（电路分析例题 1）
- key: mcu
  name: MCU 与烧录口
  name_en: MCU and programming
  units:
  - type: mcu_core
    params:
      mcu: STM32G431CBT6
      mcu_note: 电机控制 MCU（示例选型）：TIM1 三相互补 PWM、ADC 采三相电流与母线、TIM3 编码器、SPI1 读 SSI、FDCAN1
      pin_map:
        '1': +3V3
        '5': OSC_IN
        '6': OSC_OUT
        '7': NRST
        '8': ISNS_A
        '9': ISNS_B
        '10': ISNS_C
        '11': VBUS_SNS
        '14': ENC_A_F
        '15': ENC_B_F
        '16': ENC_Z_F
        '19': GND
        '20': +3V3
        '21': +3V3
        '23': GND
        '24': +3V3
        '27': PWM_AL
        '28': PWM_BL
        '29': PWM_CL
        '30': PWM_AH
        '31': PWM_BH
        '32': PWM_CH
        '33': CAN_RXD
        '34': CAN_TXD
        '35': GND
        '36': +3V3
        '37': SWDIO
        '38': SWCLK
        '40': SSI_CLK
        '41': SSI_DATA
        '45': BOOT0
        '47': GND
        '48': +3V3
      xtal: 8MHz
      c_load: 10p
  notes: [STM32G431CBT6（示例选型）]
- key: io
  name: 编码器接口与 CAN
  name_en: Encoder and CAN
  units:
  - type: encoder
    params:
      ENC_R_OHM: 1000.0
      ENC_C_PF: 220.0
      lines: 2500
      rpm_max: 6000
      fc_margin: 2.0
  - type: ssi_rs485
    params:
      xcvr: MAX3485
      r_term: 120
      z_cable: 120
  - type: can
    params:
      xcvr: MCP2562-E/SN
      r_term: 120
      z_cable: 120
  notes:
  - 编码器 A/B/Z 进 MCU 前 RC 滤波 1 kΩ / 220 pF（电路分析例题 4，截止 ≈ 723 kHz）
  - CAN 收发 MCP2562-E/SN、RS-485 收发 MAX3485 × 2（示例选型）
circuit:
  generate: [bus_input, aux_supply, phase_legs, mcu_core, encoder, ssi_rs485, can]
  parts: []
  footprints:
    FP_R: Resistor_SMD:R_0402_1005Metric
    FP_C: Capacitor_SMD:C_0402_1005Metric
    FP_C1206: Capacitor_SMD:C_1206_3216Metric
    FP_SOIC8: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
    FP_TP: TestPoint:TestPoint_Pad_D1.0mm
  nets:
    nc: [NC_U11]
    power: [+12V, +3V3, +5V, GND, VBUS]
    # 相线电流跟着规格的额定相电流走（第 111 轮）；母线、地是示例值
    high_current: {VBUS: 9.0, GND: 9.0, SW_A: spec.phase_current_a, SW_B: spec.phase_current_a, SW_C: spec.phase_current_a,
                   MOT_A: spec.phase_current_a, MOT_B: spec.phase_current_a, MOT_C: spec.phase_current_a}
  ict_test_points:
    ref_start: 10
    lib: Connector:TestPoint
    fp: TestPoint:TestPoint_Pad_D1.0mm
    block: mcu
    power_block: power
    power_block_nets: [VBUS, SW12, EN12, FB12, SW_CB, VB_MID, VBUS_SNS]
    exclude_nets: [NC_U11, SW_A, SW_B, SW_C]
    note: ICT 测试点
  back_end_items: [CONN-PWR, CONN-SIG]
board:
  outline_mm: [100.0, 70.0]
  layers: 4
  # 布线器的线宽 / 间距类别（第 111 轮由 build.py 迁来）：母线、电机线走宽线；半桥中点 SW 的大电流走铺铜，
  # 布线器只给它连驱动、自举电容这些细支路。板子上没有的网络自动去掉（+1V8 只在 B 版有）
  net_classes:
  - {name: Power, track_mm: 2.5, clearance_mm: 0.3, nets: [VBUS, MOT_A, MOT_B, MOT_C], layers: [F.Cu, B.Cu]}
  - {name: Branch, track_mm: 0.5, clearance_mm: 0.3, nets: [SW_A, SW_B, SW_C], layers: [F.Cu, B.Cu]}
  - {name: Supply, track_mm: 0.25, clearance_mm: 0.15, nets: [+12V, +5V, +3V3, SW12, VB_A, VB_B, VB_C, +1V8],
     layers: [F.Cu, In2.Cu, B.Cu]}
  - {name: Ground, track_mm: 0.25, clearance_mm: 0.15, nets: [GND]}
  stackup:
    thickness_mm: 1.6
    outer_oz: 2.0
    inner_oz: 1.0
    source: 示例值（与第 88 轮 dfm.py 按外层 2 oz、内层 1 oz 算大电流线宽一致；板厚 1.6 mm 是 KiCad 新板子的缺省值）
  rules:
    trace_dt_c: 20.0
    ict_coverage_min: 0.9
    source: 示例值（与第 88 轮 dfm.py 相同：走线允许温升 20 ℃，ICT 测试点覆盖率 ≥ 90%）；企业按自己的设计规范填
  # 热分析条件（第 111 轮，eda/wqeda/thermal/board.py）：环境温度、换热系数是假设；开关频率取自驱动板固件
  thermal:
    ambient_c: 40.0
    h_w_m2k: 10.0
    f_pwm_hz: 20000
    source: 环境温度 40 ℃、两面自然对流换热系数 10 W/(m²·K) 都是示例假设（电控箱里不通风时的量级）；PWM 20 kHz 取自 drv-joint-b/fw/src/motor.h
    heat:
    - {model: mosfet, refs: [Q1, Q2, Q3, Q4, Q5, Q6]}
    - {model: shunt, refs: [R21, R22, R23]}
  # 布局约束（第 111 轮）：检查程序 eda/wqeda/checks/layout.py 按板子上的焊盘和器件外框量。限值都是示例值：
  # 规格书和应用笔记一般只写“尽量短”“尽量靠近”，不给数；企业按自己的设计规范填
  constraints:
  - {key: loop-A, kind: loop, name: A 相半桥换流回路, refs: [C11, Q1, Q2], nets: [VBUS, SW_A, GND], max_area_mm2: 80,
     source: 示例值（本板三相各量得约 66 mm²，留了余量）}
  - {key: loop-B, kind: loop, name: B 相半桥换流回路, refs: [C12, Q3, Q4], nets: [VBUS, SW_B, GND], max_area_mm2: 80,
     source: 示例值（本板三相各量得约 66 mm²，留了余量）}
  - {key: loop-C, kind: loop, name: C 相半桥换流回路, refs: [C13, Q5, Q6], nets: [VBUS, SW_C, GND], max_area_mm2: 80,
     source: 示例值（本板三相各量得约 66 mm²，留了余量）}
  - {key: kelvin-A, kind: kelvin, name: A 相采样电阻 R21, ref: R21, ties: [NT1, NT2], source: 第 88 轮设计：采样线经网络连接点从电阻焊盘引出}
  - {key: kelvin-B, kind: kelvin, name: B 相采样电阻 R22, ref: R22, ties: [NT3, NT4], source: 第 88 轮设计：采样线经网络连接点从电阻焊盘引出}
  - {key: kelvin-C, kind: kelvin, name: C 相采样电阻 R23, ref: R23, ties: [NT5, NT6], source: 第 88 轮设计：采样线经网络连接点从电阻焊盘引出}
  - {key: near-C40, kind: near, name: C40 去耦 U10 第 1 脚, ref: C40, to: U10, pin: '1', max_mm: 3.0, source: 示例值}
  - {key: near-C41, kind: near, name: C41 去耦 U10 第 36 脚, ref: C41, to: U10, pin: '36', max_mm: 3.0, source: 示例值}
  - {key: near-C42, kind: near, name: C42 去耦 U10 第 24 脚, ref: C42, to: U10, pin: '24', max_mm: 3.0, source: 示例值}
  - {key: near-C44, kind: near, name: C44 去耦 U10 第 20 脚, ref: C44, to: U10, pin: '20', max_mm: 3.0, source: 示例值}
