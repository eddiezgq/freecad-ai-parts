# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠缝纫机厂（第 134 轮）：按《缝纫机厂工艺方案》（docs/方案/缝纫机厂工艺方案.md）建的整机厂——
#   ① 机壳铸造（熔炼、制芯、造型、浇注、冷却、落砂、清理、第一次时效、腻子底漆、铸件检验）
#   ② 机壳加工（平缝机壳线、包缝机壳线：粗铣底面 → 粗加工 → 第二次时效 → 精铣底面铰销孔 → 钻攻 → 精镗孔系一次装夹 → 去毛刺 → 清洗 → 三坐标、终检 → 面漆烘干）
#   ③ 关键零件（轴、针杆、旋梭、偏心）④ 平缝机装配（节拍 2.4 min）⑤ 包缝机装配（节拍 7.2 min）、计量室、库房
# 产品：工业直驱平缝机 WQ-LS、四线包缝机 WQ-OL。外购件写通用名称 +“型号待确认”；单价、工时、费率、公差、名义值、散布、车间尺寸都是示例值。
# 本文件由脚本生成后手工维护；ERPNext 一种物料一张检验模板，所以每种物料的测量都记在它最后一道检验工序上（名称里写了在哪台设备测的）。
