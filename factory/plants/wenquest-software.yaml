# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠数字工业园 · 软件公司（第 167 轮）：实时操作系统、服务器 / 桌面操作系统、云平台、数字工厂（工业软件）、机器人软件。
# 软件的“生产线”是发布流水线：合并与评审 → 编译与单元测试 → 集成测试 → 硬件在环测试 / 长稳压测 → 安全扫描 → 发布门禁 → 签名发布。
#   一次构建 = 一张工单（版本构建做成成品，按“定制版本交付”卖）；物料清单就是软件物料清单（SBOM：开源与第三方组件、签名）；
#   来料检验 = 组件进来先查许可证与已知漏洞。
# 授权（实时 OS、OS、机器人软件，每台设备一份）走“授权签发”；订阅（云平台、数字工厂）走“资源开通 → 24 小时服务验收”。
# 工业园：计算机厂买 OS 授权、机器人厂买机器人软件授权、电路板厂的关节驱动板买实时 OS 授权；软件公司向计算机厂买整机柜建云平台机房。
# 设备是构建服务器、测试机群、硬件在环测试台（接真的关节驱动板）、长稳压测平台、云平台宿主机（两个可用区）。
# 测试通过率、中断延迟、内存泄漏速率由构建流水线模型算出，云服务延迟、错误率、可用性由 24 小时服务曲线算出（sim/softsim.py；参数随测量记录带走）。
# 单价、工时、设备费率、测试数量、测量名义值与散布都是示例值；开源组件单价 0（审查成本另计），商业组件写通用名称 +“型号待确认”。
