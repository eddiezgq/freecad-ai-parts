measurements:
# 贴片板：在 AOI 工位按板记下这块板的 SPI、炉温记录和 AOI 结果（名义值、散布是示例值）
- item: SMT-DRV
  operation: 自动光学检测 AOI
  chars: &smt
  - {code: spi_volume, name: 锡膏体积（SPI，相对钢网开孔）, unit: '%', nominal: 100, lo: 70, hi: 130, sigma: 5}
  - {code: spi_height, name: 锡膏高度（SPI）, unit: μm, nominal: 120, lo: 95, hi: 145, sigma: 5}
  - {code: reflow_peak, name: 回流峰值温度（炉温记录）, unit: ℃, nominal: 245, lo: 235, hi: 255, sigma: 1.2}
  - {code: reflow_tal, name: 液相线以上时间（炉温记录）, unit: s, nominal: 65, lo: 45, hi: 90, sigma: 3}
  - {code: offset_chip, name: 片式元件偏移（AOI，高速贴片）, unit: μm, nominal: 0, lo: -75, hi: 75, sigma: 12}
  - {code: offset_ic, name: IC 与 MOSFET 偏移（AOI，多功能贴片）, unit: μm, nominal: 0, lo: -50, hi: 50, sigma: 8}
  - {code: aoi_defects, name: AOI 缺陷数（立碑、桥连、少锡、偏移、错件、反向）, unit: 个, nominal: 0, lo: 0, hi: 0, sigma: 0}
- {item: SMT-AGV, operation: 自动光学检测 AOI, chars: *smt}
- {item: SMT-ENC, operation: 自动光学检测 AOI, chars: *smt}
- {item: SMT-DRV-B, operation: 自动光学检测 AOI, chars: *smt}
# 成品板：在功能测试工位记下 ICT 的采样电阻阻值和功能测试结果（老化之后测）
