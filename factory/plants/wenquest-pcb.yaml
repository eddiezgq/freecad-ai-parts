# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠数字工业园 · 电路板厂（第 85 轮，电子 E3）：关节伺服驱动板 DRV-JOINT、AGV 控制板 CTRL-AGV、编码器读头板 ENC-RD。
# 一条 SMT 线（印刷 → 锡膏检测 → 高速贴片 → 多功能贴片 → 回流焊 → 自动光学检测）做“贴片板”，
# 后段（选择焊 → 在线测试 → 烧录 → 三防涂覆 → 老化 → 功能测试 → 包装）做成品板。机器人厂的驱动板、AGV 控制板向这里买（park）。
# 第 106 轮：试产驱动板 B 版 DRV-JOINT-B（第 118 轮起供机器人厂关节模组）（放上编码器接口芯片 WQ-ENCIF，第 98 轮设计）：芯片向工业园的问渠芯片厂买，一次一整批
#   （34 000 只，pack；对方物料号 WQ-ENCIF 1 批，park_item）。现实里芯片未流片、B 版不投产——这里是工业园（仿真）里试产。
# 外购件一律写通用名称 +“型号待确认”，不编厂商型号。
# 单价、交货期、工时、设备费率、车间尺寸、测量名义值与散布都是示例值，不是哪家真实工厂的数据。
# 一种物料只有一处测量特性（ERPNext 一种物料一张检验模板）：贴片板在 AOI 工位把 SPI、炉温记录、AOI 结果一起记（按板追溯）；
# 成品板在功能测试工位把 ICT 采样电阻阻值和 FCT 结果一起记。
