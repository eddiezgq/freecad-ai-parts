  - {code: fct_isense, name: 相电流采样误差, unit: '%', nominal: 0, lo: -2, hi: 2, sigma: 0.35}
  - {code: fct_deadtime, name: 栅极死区时间, unit: ns, nominal: 200, lo: 160, hi: 240, sigma: 6}
  - {code: fct_enc, name: 编码器接口读数误差, unit: count, nominal: 0, lo: -2, hi: 2, sigma: 0.4}
