# 测量（名义值、规格限、散布都是示例值）：ERPNext 一种物料一张检验模板，所以一台电机的全部测量记在“电机终检”这道工序上；
# 定子测试台、动平衡机、抱闸测试台测的写在名称里。反电势常数、三相不平衡、THD、齿槽转矩由终检波形算出（见“电机终检波形”页）
measurements:
- item: WQ-SM100
  operation: 电机终检 Motor final test
  chars:
  - {code: st_r_unbal, name: 三相电阻不平衡（定子测试台）, unit: '%', nominal: 0.4, lo: 0, hi: 1.5, sigma: 0.12}
  - {code: st_surge, name: 匝间冲击波形面积差（定子测试台）, unit: '%', nominal: 2.0, lo: 0, hi: 5.0, sigma: 0.5}
  - {code: st_leak, name: 耐压漏电流（定子测试台，1500 V 1 s）, unit: mA, nominal: 0.30, lo: 0, hi: 1.0, sigma: 0.06}
  - {code: rb_unbal, name: 转子剩余不平衡量（动平衡机）, unit: g·mm, nominal: 8, lo: 0, hi: 20, sigma: 2}
  - {code: brk_hold, name: 抱闸静态保持力矩（抱闸测试台）, unit: N·m, nominal: 0.45, lo: 0.32, hi: 0.7, sigma: 0.03}
  - {code: mt_ke, name: 反电势常数（相对额定）, unit: '%', nominal: 100, lo: 95, hi: 105, sigma: 0.8}
  - {code: mt_unbal, name: 反电势三相不平衡, unit: '%', nominal: 0.4, lo: 0, hi: 2.0, sigma: 0.15}
