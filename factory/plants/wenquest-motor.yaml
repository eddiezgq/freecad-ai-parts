# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠数字工业园 · 电机厂（第 131 轮）：做协作机器人关节和 AGV 驱动轮用的永磁同步伺服电机。
#   伺服电机 WQ-SM100 / WQ-SM200 / WQ-SM400（带失电制动抱闸）、AGV 驱动电机 WQ-AM750：卖给工业园的机器人厂（它的 MTR-SV-100/200/400、MTR-AGV-750）
# 定子线：来料检验 → 铁芯叠压 → 绕线（2 台）→ 嵌线整形 → 浸漆烘干 → 定子测试（相电阻、匝间冲击、耐压）
# 转子线：磁钢粘贴 → 充磁 → 动平衡
# 总装线：电机总装（压轴承、装抱闸、装端盖）→ 抱闸测试 → 电机终检（测功台：反电势波形、齿槽转矩、空载电流）→ 包装
# 外购件写通用名称 +“型号待确认”；单价、交货期、工时、设备费率、车间尺寸、测量名义值与散布、极槽数（10 极 12 槽）都是示例值。
# 反电势常数、三相不平衡、谐波畸变、齿槽转矩由终检波形算出（sim/motorwave.py；波形参数随测量记录带走，“电机终检波形”页还原）。
