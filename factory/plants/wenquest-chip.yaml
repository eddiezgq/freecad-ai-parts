  - {code: cp_contact, name: 探针接触电阻（各测试位平均）, unit: Ω, nominal: 1.0, lo: 0, hi: 3.0, sigma: 0.08}
  - {code: cp_iddq, name: 静态电流 IDDQ（中位数）, unit: µA, nominal: 1.0, lo: 0, hi: 10, sigma: 0.12}
  - {code: cp_vtp, name: 施密特上阈值 VT+（中位数，第 93 轮仿真 1.254 V）, unit: V, nominal: 1.254, lo: 1.10, hi: 1.40, sigma: 0.015}
  - {code: cp_vtm, name: 施密特下阈值 VT−（中位数，第 93 轮仿真 0.607 V）, unit: V, nominal: 0.607, lo: 0.45, hi: 0.75, sigma: 0.015}
# 成品：在 FT 工位把这一批的键合、塑封、划片抽检和 FT 结果一起记
- item: WQ-ENCIF
  operation: 成品测试 FT Final test
  chars: &ft
  - {code: chipping, name: 划片崩边（抽检最大值）, unit: µm, nominal: 10, lo: 0, hi: 25, sigma: 1.5}
  - {code: bond_pull, name: 键合拉力（抽检最小值）, unit: gf, nominal: 6.0, lo: 3.0, hi: 12, sigma: 0.3}
  - {code: ball_shear, name: 焊球推力（抽检平均）, unit: gf, nominal: 25, lo: 15, hi: 40, sigma: 1.2}
  - {code: mold_void, name: 塑封空洞率（X 光抽检）, unit: '%', nominal: 1.0, lo: 0, hi: 3.0, sigma: 0.15}
  - {code: ft_yield, name: FT 良率, unit: '%', nominal: 98, lo: 95, hi: 100, sigma: 0.35}
  - {code: ft_idd, name: 工作电流（50 MHz，中位数；第 92 轮版图约 0.67 mA）, unit: mA, nominal: 0.67, lo: 0.4, hi: 1.0, sigma: 0.02}
  - {code: ft_hyst, name: 施密特回差（中位数；第 93 轮仿真 0.648 V）, unit: V, nominal: 0.648, lo: 0.45, hi: 0.85, sigma: 0.012}
- {item: WQ-ENCIF-ES, operation: 成品测试 FT Final test, chars: *ft}
