# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠数字工业园 · 芯片厂（第 103 轮，电子 E9）：封装测试厂，做编码器接口芯片 WQ-ENCIF（第 92、93 轮设计）。
# 设计自己做（第 92/93 轮）、晶圆交代工厂流片（外协，SKY130 工艺），本厂做封装测试：
#   晶圆段：来料检验 → 晶圆测试 CP（探针台 + 测试机，8 个测试位）→ 减薄，出“已测晶圆”（带晶圆图）
#   封装段：划片 → 装片 → 等离子清洗 → 引线键合（2 台）→ 塑封 → 后固化 → 激光打标 → 电镀 → 切筋成型 → 成品测试 FT → 编带包装
# 一个单位 = 一片晶圆的批次（封测厂按晶圆批流转；CP 良率、晶圆图本来就按片统计）：
#   200 mm 晶圆、芯片 0.80 × 0.80 mm（示例：内核 0.15 × 0.16 mm 来自第 92 轮版图，加 16 个焊盘的焊盘环按示例估），划片道 80 µm
#   → 有效芯片每片约 37 700 颗（边缘去除 3 mm，按 sim/wafermap.py 的网格数）；CP 良率约 92 %、FT 良率约 98 % → 每片约 34 000 只成品、
#   编带 12 盘（每盘 3000 只，最后一盘不满）。都是示例值。
# 外购件写通用名称 +“型号待确认”；单价、交货期、工时、设备费率、车间尺寸、测量名义值与散布都是示例值。
# 测量名义值里施密特阈值（1.254 V / 0.607 V、回差 0.648 V）取第 93 轮晶体管级仿真、工作电流（约 0.67 mA）取第 92 轮版图功耗 1.21 mW ÷ 1.8 V；散布是示例值。
# 一种物料只有一处测量特性：已测晶圆在 CP 工位记（按片），成品在 FT 工位把键合、塑封、划片抽检和 FT 结果一起记（按批追溯）。
