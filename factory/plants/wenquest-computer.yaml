# 测量（名义值、规格限、散布都是示例值）：ERPNext 一种物料一张检验模板，一种物料的测量都记在它最后一道检验工序上：
#   主板在在线测试工位记 SPI、X 光、上电供电；内存条在内存测试机；机箱在喷粉后；笔记本壳在阳极氧化后；整机在整机功能测试（含老化曲线算出的两项）；整机柜在联调。
measurements:
- item: MB-PC
  operation: 在线测试 ICT
  chars: &mb
  - {code: mb_paste, name: 锡膏厚度（SPI）, unit: μm, nominal: 120, lo: 90, hi: 150, sigma: 6}
  - {code: mb_void, name: BGA 焊点空洞率（X 光，最大一颗）, unit: '%', nominal: 8, lo: 0, hi: 25, sigma: 2.2}
  - {code: mb_vcore, name: CPU 核心供电电压偏差（上电测试）, unit: mV, nominal: 0, lo: -15, hi: 15, sigma: 2.2}   # 第 166b 轮案例 A 的公差叠加（tools/cases/computer_a.py）
- {item: MB-NB, operation: 在线测试 ICT, chars: *mb}
- {item: MB-SV, operation: 在线测试 ICT, chars: *mb}
- item: DIMM-32
  operation: 内存测试 Memory test
  chars:
  - {code: mem_margin, name: 读写时序余量（内存测试机）, unit: ps, nominal: 55, lo: 30, hi: 90, sigma: 5}
  - {code: mem_vdd, name: 板载电源输出偏差, unit: mV, nominal: 0, lo: -25, hi: 25, sigma: 4}
- item: CHS-PC
  operation: 喷粉 Powder coating
  chars: &chs
  - {code: chs_bend, name: 折弯角度偏差, unit: °, nominal: 0, lo: -0.5, hi: 0.5, sigma: 0.12}
  - {code: chs_hole, name: 安装孔位置偏差（主板、电源安装孔）, unit: mm, nominal: 0, lo: -0.2, hi: 0.2, sigma: 0.04}
  - {code: chs_coat, name: 涂层厚度, unit: μm, nominal: 70, lo: 50, hi: 100, sigma: 6}
- {item: CHS-SV, operation: 喷粉 Powder coating, chars: *chs}
- item: NBC-14
  operation: 阳极氧化 Anodizing
  chars:
  - {code: nbc_flat, name: A 面平面度, unit: mm, nominal: 0.08, lo: 0, hi: 0.2, sigma: 0.025}
  - {code: nbc_anod, name: 阳极膜厚, unit: μm, nominal: 12, lo: 8, hi: 18, sigma: 1.2}
- item: WQ-PC1
  operation: 整机功能测试 System test
  chars: &pc
  - {code: pc_tmax, name: CPU 满载温度（老化曲线）, unit: ℃, nominal: 75, lo: 0, hi: 90, sigma: 1.8}
  - {code: pc_pavg, name: 老化平均功耗（老化曲线）, unit: W, nominal: 151, lo: 0, hi: 200, sigma: 2.5}
  - {code: pc_noise, name: 满载风扇噪声, unit: dB(A), nominal: 38, lo: 0, hi: 45, sigma: 1.5}
  - {code: pc_boot, name: 开机到系统就绪时间, unit: s, nominal: 14, lo: 0, hi: 25, sigma: 1.5}
  - {code: pc_membw, name: 内存带宽, unit: GB/s, nominal: 70, lo: 60, hi: 90, sigma: 2}
- {item: WQ-IPC, operation: 整机功能测试 System test, chars: *pc}
- item: WQ-NB14
  operation: 整机功能测试 System test
  chars:
  - {code: pc_tmax, name: CPU 满载温度（老化曲线）, unit: ℃, nominal: 86, lo: 0, hi: 97, sigma: 2.1}
  - {code: pc_pavg, name: 老化平均功耗（老化曲线）, unit: W, nominal: 48, lo: 0, hi: 60, sigma: 0.8}
  - {code: pc_noise, name: 满载风扇噪声, unit: dB(A), nominal: 34, lo: 0, hi: 40, sigma: 1.2}
  - {code: pc_boot, name: 开机到系统就绪时间, unit: s, nominal: 12, lo: 0, hi: 20, sigma: 1.2}
  - {code: pc_membw, name: 内存带宽, unit: GB/s, nominal: 90, lo: 80, hi: 110, sigma: 2}
- item: WQ-SV2U
  operation: 整机功能测试 System test
  chars:
