  - {code: rk_dt, name: 背门换热器进出风温差, unit: ℃, nominal: 2.0, lo: 0, hi: 4.0, sigma: 0.4}
  - {code: rk_link, name: 交换机链路误码（每 10¹² 位）, unit: 个, nominal: 0.1, lo: 0, hi: 1.0, sigma: 0.05}
