# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠数字工业园 · 计算机厂（第 166 轮）：台式机、14 英寸笔记本、2U 双路服务器、42U 整机柜（交付算力中心 / 数据中心）、工控机（卖给机器人厂）。
# 自制：三种主板（台式、笔记本、服务器）、DDR5 内存条、台式与服务器机箱（钣金）、笔记本铝壳（CNC + 阳极氧化）。
# 外购：CPU、内存颗粒、固态硬盘、屏幕、电池、电源与适配器、风扇、散热器、交换机、配电单元、背门换热器、机柜框架——CPU 与内存颗粒要晶圆厂，
#       工业园的芯片封测厂做不了，外购是实情。
# 主板线（SMT）：来料检验 → 锡膏印刷 → 锡膏检测 → 贴片（2 台）→ 回流焊 → 光学检测 → X 光检测（BGA）→ 选择焊 → 在线测试 → BIOS 烧录
# 内存条线：与主板共用 SMT 线 → 内存测试（8 个测试座）
# 结构件线：激光切割 → 数控折弯 → 压铆 → 喷粉；笔记本壳：加工中心 → 阳极氧化
# 整机线：涂导热硅脂（点胶机 2 台）→ 整机装配（台式 / 笔记本 / 服务器 3 个工位）→ 开机自检与系统灌装 → 老化 → 整机功能测试 → 包装
# 整机柜：上架布线 → 整机柜联调（满载、散热、功耗、链路）→ 包装出货
# 外购件一律写通用名称 +“型号待确认”，不编厂商型号。单价、交货期、工时、设备费率、车间尺寸、测量名义值与散布都是示例值。
# CPU 满载温度、老化平均功耗由整机老化曲线算出（sim/burnin.py；曲线参数随测量记录带走，“整机老化曲线”页还原）。
