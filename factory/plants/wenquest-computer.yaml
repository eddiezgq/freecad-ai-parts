routings:
- name: RT-主板 Mainboard
  steps: [[来料检验 Incoming inspection, 5], [锡膏印刷 Stencil printing, 2], [锡膏检测 SPI, 1], [高速贴片 Chip placement, 6], [多功能贴片 IC placement, 6],
          [回流焊 Reflow soldering, 8], [自动光学检测 AOI, 3], [X 光检测 X-ray inspection, 4], [选择焊 Selective soldering, 4], [在线测试 ICT, 5],
          [BIOS 烧录 BIOS programming, 3]]
- name: RT-内存条 Memory module
  steps: [[锡膏印刷 Stencil printing, 1], [锡膏检测 SPI, 1], [高速贴片 Chip placement, 2], [多功能贴片 IC placement, 2], [回流焊 Reflow soldering, 8],
          [自动光学检测 AOI, 2], [内存测试 Memory test, 15]]
- name: RT-机箱 Chassis
  steps: [[激光切割 Laser cutting, 6], [数控折弯 Press braking, 8], [压铆 Self-clinching, 4], [喷粉 Powder coating, 40]]
- name: RT-笔记本壳 Notebook housing
  steps: [[壳体加工 Housing machining, 25], [阳极氧化 Anodizing, 60]]
- name: RT-台式机 Desktop
  steps: [[涂导热硅脂 TIM dispensing, 2], [台式机装配 Desktop assembly, 20], [开机自检与灌装 POST & imaging, 15], [老化 Burn-in, 240],
          [整机功能测试 System test, 10], [包装 Packing, 5]]
- name: RT-笔记本 Notebook
  steps: [[涂导热硅脂 TIM dispensing, 2], [笔记本装配 Notebook assembly, 35], [开机自检与灌装 POST & imaging, 15], [老化 Burn-in, 240],
          [整机功能测试 System test, 12], [包装 Packing, 5]]
- name: RT-服务器 Server
  steps: [[涂导热硅脂 TIM dispensing, 4], [服务器装配 Server assembly, 40], [开机自检与灌装 POST & imaging, 20], [老化 Burn-in, 720],
          [整机功能测试 System test, 20], [包装 Packing, 8]]
- name: RT-整机柜 Rack
  steps: [[整机柜联调 Rack integration test, 480], [包装 Packing, 60]]
