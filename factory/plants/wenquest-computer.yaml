  - {code: pc_pavg, name: 老化平均功耗（老化曲线）, unit: W, nominal: 626, lo: 0, hi: 760, sigma: 7.5}
  - {code: pc_boot, name: 开机到系统就绪时间（含内存训练）, unit: s, nominal: 120, lo: 0, hi: 180, sigma: 8}
  - {code: pc_membw, name: 内存带宽, unit: GB/s, nominal: 520, lo: 480, hi: 600, sigma: 8}
