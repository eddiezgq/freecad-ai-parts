measurements:
# 编码器：终检时在基准编码器上复测整圈误差曲线（4096 点）、读头信号幅值；前四项由曲线算出（见“编码器误差曲线”页）
- item: WQ-ENC17
  operation: 编码器终检 Encoder final test
  chars:
  - {code: enc_acc, name: 精度（整圈误差峰峰值）, unit: '″', nominal: 50, lo: 0, hi: 100, sigma: 6}
  - {code: enc_h1, name: 一次谐波（偏心）幅值, unit: '″', nominal: 12, lo: 0, hi: 30, sigma: 3}
  - {code: enc_interp, name: 细分误差（峰峰值）, unit: '″', nominal: 8, lo: 0, hi: 20, sigma: 1}
  - {code: enc_amp, name: 信号幅值（平均，额定 = 100 %）, unit: '%', nominal: 100, lo: 80, hi: 120, sigma: 3}
  - {code: enc_amp_min, name: 信号幅值（整圈最低）, unit: '%', nominal: 95, lo: 70, hi: 120, sigma: 3}
# 扭矩传感器：砝码标定（加载、卸载各 5 级）后在终检台复测；都按满量程（FS）的百分数
- item: WQ-TS
  operation: 扭矩终检 Torque final test
  chars:
  - {code: ts_nonlin, name: 非线性, unit: '%FS', nominal: 0.10, lo: 0, hi: 0.30, sigma: 0.02}
  - {code: ts_hyst, name: 滞后, unit: '%FS', nominal: 0.08, lo: 0, hi: 0.25, sigma: 0.015}
  - {code: ts_zero, name: 零点输出, unit: '%FS', nominal: 0, lo: -0.5, hi: 0.5, sigma: 0.1}
  - {code: ts_creep, name: 蠕变（满量程保持 30 min）, unit: '%FS', nominal: 0.03, lo: 0, hi: 0.10, sigma: 0.008}
  - {code: ts_tczero, name: 零点温漂（每 10 K）, unit: '%FS', nominal: 0.05, lo: 0, hi: 0.15, sigma: 0.012}
