# 工厂清单（ADR-0064；第 2 版见问渠第 45 轮）。改完用 python -m factory.plant check 本文件 校验。
# 问渠数字工业园 · 传感器厂（第 125 轮，电子 E12）：做协作机器人关节里的两种传感器。
#   关节绝对值编码器 WQ-ENC17（光电式、17 位单圈，示例）：卖给工业园的机器人厂（它的 ENC-ABS），读头板 ENC-RD 向工业园的电路板厂买
#   关节扭矩传感器 WQ-TS（应变片式、全桥，示例）：卖给示例外部客户（机器人厂以后做力控关节时再买）
# 编码器线（洁净间）：来料检验 → 码盘清洗 → 码盘粘接对心（2 台）→ 读头装调（调间隙）→ 精度标定（对照基准编码器，写补偿表）→ 温度循环 → 终检（复测整圈误差曲线）→ 包装
# 扭矩传感器线：来料检验 → 应变片粘贴 → 胶固化 → 组桥焊线 → 温度补偿 → 砝码标定 → 终检 → 包装
# 外购件写通用名称 +“型号待确认”；单价、交货期、工时、设备费率、车间尺寸、测量名义值与散布、码盘半径与线数都是示例值。
# 编码器的精度、一次谐波、细分误差、信号幅值由整圈误差曲线算出（sim/enccurve.py；曲线参数随测量记录带走，“编码器误差曲线”页还原）。
