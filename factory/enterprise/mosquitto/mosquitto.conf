# 问渠数字工厂 · 企业安装版的数据总线（ADR-0063）
# 1883：只在容器网络内部，枢纽、仿真、桥接各用一个账号，按主题授权（acl）
# 9001：浏览器经 Caddy 的 wss://<域名>/mqtt 连接，匿名，只能订阅（acl_web）
# 8883：现场网关从工厂经公网连来，TLS（证书由安装脚本生成的工厂自有 CA 签发）+ 账号密码
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl_web

listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
