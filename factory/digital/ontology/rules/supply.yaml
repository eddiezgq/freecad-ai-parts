domain: supply
rules:
  W1:
    name: 缺料 / 低于安全库存
    fn: stock_short
    severity: warn
    role: [planner]
    desc: 看板“关键物料”为红色。原 AI 提醒迁来
    hint: 起草请购单
  W2:
    name: 采购单逾期到货
    fn: po_late
    severity: warn
    role: [planner]
    desc: 采购行的计划到货日已过、未收齐
    hint: 催货；评估是否影响工单，必要时找替代供应商
  W3:
    name: 来料检验不合格未处理
    fn: incoming_rejected
    demo_only: true      # 第 30 轮 H-2：E1–E7 的规则，只在演示工厂跑（企业工厂按“待数据”）
    severity: warn
    role: [planner, quality]
    desc: 一批来料检验判不合格，还没退货或让步接收（轴承为严重）（第 18 轮 E5）
    hint: 看右栏四个方案：退货等补发 / 备选供应商急单 / 让步接收全检 / 不处理（对照）
  W4:
    name: 供应商准时率低
    fn: supplier_late
    demo_only: true      # 第 30 轮 H-2：E1–E7 的规则，只在演示工厂跑（企业工厂按“待数据”）
    severity: warn
    role: [planner, manager]
    params: {days: 30, on_time: 0.8, min_lots: 3}
    desc: 近 days 天到货至少 min_lots 批，准时率低于 on_time
    hint: 和供应商谈交期；单一来源的考虑开发备选
  W5:
    name: 供应商来料合格率低
    fn: supplier_quality
    demo_only: true      # 第 30 轮 H-2：E1–E7 的规则，只在演示工厂跑（企业工厂按“待数据”）
    severity: warn
    role: [quality, manager]
    params: {days: 30, pass_rate: 0.95, min_lots: 3}
    desc: 近 days 天检验至少 min_lots 批，合格率低于 pass_rate（让步接收不算合格）
    hint: 要求供应商 8D 整改；提高抽检比例
  W6:
    name: 单一来源
    fn: single_source
    demo_only: true      # 第 30 轮 H-2：E1–E7 的规则，只在演示工厂跑（企业工厂按“待数据”）
    severity: info
    role: [planner, manager]
    desc: 一类物料只有一家在用的供应商
    hint: 看右栏：开发备选供应商（平时仍向默认供应商下单）
  W7:
    name: 可疑批次已用到零件上
    fn: suspect_batch_used
    demo_only: true      # 第 30 轮 H-2：E1–E7 的规则，只在演示工厂跑（企业工厂按“待数据”）
    severity: critical
    role: [quality, manager]
    desc: 判为可疑的批次已经用到了零件上（批次追溯）
    hint: 扣住在制品复检；查装了这些零件的现场设备（客户与服务的追溯）
