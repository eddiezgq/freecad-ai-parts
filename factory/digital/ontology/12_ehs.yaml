domain: ehs
order: 12
label: 安全、健康与环境
label_en: EHS
row: support
types:
  Hazard:
    label: 危险源
    label_en: Hazard
    maturity: have
    sources: [平台危险源清单（第 18 轮 E2）]
    key: 危险源编号
    title: "{key} {name}"
    props:
      name: {t: str, l: 名称}
      level: {t: str, l: 风险等级}
      area: {t: str, l: 区域}
      score: {t: num, l: 风险值（可能性 × 严重度）}
      controls: {t: json, l: 控制措施}
    links:
      machine: {to: Machine, l: 设备, inv: 危险源}
  RiskAssessment:
    label: 风险评估
    label_en: Risk assessment
    maturity: capture
    key: 评估编号
    title: "{key}"
    props:
      task: {t: str, l: 作业}
      score: {t: num, l: 风险值}
      controls: {t: json, l: 控制措施}
    links:
      hazard: {to: Hazard, l: 危险源, inv: 风险评估}
  SafetyIssue:
    label: 隐患
    label_en: Safety issue
    maturity: have
    sources: [“安全环保”页隐患随手拍（第 18 轮 E2）]
    key: 隐患单号
    title: "{key} {subject}"
    props:
      subject: {t: str, l: 内容}
      level: {t: str, l: 等级（一般 / 重大）}
      status: {t: str, l: 状态}
      due: {t: date, l: 整改期限}
      owner: {t: str, l: 整改人}
      found_by: {t: str, l: 发现人}
    links:
      machine: {to: Machine, l: 设备, inv: 隐患}
      lockout: {to: WorkPermit, l: 挂牌上锁, inv: 因隐患}
      hazard: {to: Hazard, l: 危险源, inv: 隐患}
  Incident:
    label: 事故 / 未遂
    label_en: Incident / near miss
    maturity: have
    sources: [“安全环保”页事故与未遂（第 18 轮 E2）]
    sensitivity: 3
    key: 事件号
    title: "{key} {kind}"
    props:
      kind: {t: str, l: 种类}
      severity: {t: str, l: 严重度}
      date: {t: date, l: 日期}
      root_cause: {t: str, l: 根因}
    links:
      machine: {to: Machine, l: 设备, inv: 事故}
  WorkPermit:
    label: 作业许可
    label_en: Work permit
    maturity: have
    sources: [“安全环保”页作业许可（第 18 轮 E2）]
    key: 许可证号
    title: "{key} {kind}"
    props:
      kind: {t: str, l: 种类（动火 / 高处 / 受限空间 / 挂牌上锁）}
      status: {t: str, l: 状态}
      valid_from: {t: time, l: 开始}
      valid_to: {t: time, l: 结束}
    links:
      machine: {to: Machine, l: 设备, inv: 作业许可}
      holder: {to: Employee, l: 作业人, inv: 作业许可}
  SafetyTraining:
    label: 安全培训
    label_en: Safety training
    maturity: have
    sources: [平台培训记录（第 18 轮 E2；人员领域包上线后并入）]
    key: 培训编号
    title: "{key} {topic}"
    props:
      topic: {t: str, l: 主题}
      date: {t: date, l: 日期}
      valid_months: {t: int, l: 有效期, u: 月}
      valid_until: {t: date, l: 有效期到}
    links:
      employee: {to: Employee, l: 员工, inv: 安全培训}
  PpeIssue:
    label: 劳保发放
    label_en: PPE issue
    maturity: capture
    key: 发放记录号
    title: "{key}"
    props:
      item: {t: str, l: 用品}
      date: {t: date, l: 日期}
    links:
      employee: {to: Employee, l: 员工, inv: 劳保}
  Chemical:
    label: 化学品
    label_en: Chemical
    maturity: have
    sources: [平台化学品台账（第 18 轮 E2）]
    key: 化学品编号
    title: "{name}"
    props:
      name: {t: str, l: 名称}
      stock_kg: {t: num, l: 存量, u: kg}
      sds: {t: str, l: 安全数据表}
  Waste:
    label: 废弃物
    label_en: Waste
    maturity: have
    sources: [平台废弃物台账（第 18 轮 E2）]
    key: 记录号
    title: "{key} {kind}"
    props:
      kind: {t: str, l: 种类}
      qty_kg: {t: num, l: 数量, u: kg}
      disposed_by: {t: str, l: 处置单位}
  Emission:
    label: 排放指标
    label_en: Emission
    maturity: capture
    key: 监测点/日期
    title: "{key}"
    props:
      pollutant: {t: str, l: 污染物}
      value: {t: num, l: 数值, series: true}
      limit: {t: num, l: 限值}
  EmergencyDrill:
    label: 应急演练
    label_en: Emergency drill
    maturity: capture
    key: 演练编号
    title: "{key} {scenario}"
    props:
      scenario: {t: str, l: 情景}
      date: {t: date, l: 日期}
