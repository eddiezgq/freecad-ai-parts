# 问渠数字工厂 · 统一数据总线（Mosquitto）
# 1883：各服务用的 MQTT；9001：浏览器（看板、3D 车间、车间终端）用的 MQTT over WebSocket
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 9001
protocol websockets

# 第 1 轮在自己电脑上运行，允许匿名；工业版按附录 A.4 第 7 条为每个组件建账号并按主题授权：
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   acl_file /mosquitto/config/acl
allow_anonymous true
