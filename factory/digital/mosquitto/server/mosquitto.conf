# 问渠数字工厂 · 统一数据总线（服务器版，第 3 轮 D5）
# 1883：只在容器网络内部，服务各用一个账号（passwd 由安装脚本生成），按主题授权（acl）
# 9001：浏览器经 Caddy 的 wss://factory.<域名>/mqtt 连接，匿名，只能订阅（acl_web）
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9001
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl_web
