excluded:
  - "IT01、IT0：s1、s2、s3 都有，但任务只要 IT1–IT18，未收。"
  - "公称尺寸 500–3150 mm 各行：s1 有，但未做第二出处核对，未收。"
  - "GB/T 1800.1-2020 标准原文 PDF（muzing OSS 链接）返回 404，engineersedge、tokari 被 robots 拒绝，均未能读取。"
  - "IT1–IT4 的计算公式（ISO 286-1 附录中的几何级数插值）：没有读到可靠原文，不收。"
notes:
  - "单位：原标准 IT1–IT11 以 μm 给出，IT12–IT18 以 mm 给出；本表全部换成 μm（IT12–IT18 的值 = 原 mm 值 ×1000），列名后缀统一为 _um。"
  - "src=s1+s2+s3：IT1–IT16 三站逐格一致；IT17、IT18 只在 s1、s2 中有，两站一致（s3 无这两级）。"
  - "查表规则：尺寸段为“大于 size_over_mm，至 size_to_mm（含）”；第一段为 ≤3 mm（size_over_mm 记 0）。标准公差按尺寸段取值，段内不插值。"
  - "formula：IT5–IT18 的标准公差 = 倍数 × i，标准公差因子 i = 0.45·D^(1/3) + 0.001·D（i 单位 μm，D 单位 mm，D = 尺寸段上下限的几何平均 √(D1·D2)）。倍数：IT5=7i，IT6=10i，IT7=16i，IT8=25i，IT9=40i，IT10=64i，IT11=100i，IT12=160i，IT13=250i，IT14=400i，IT15=640i，IT16=1000i，IT17=1600i，IT18=2500i。出处：s4 附录 A2.2.2（i 公式）与 A2.3（IT5–IT18 倍数，7i…2500i）；s5 独立给出 i 的定义（D 为几何平均）和 IT6–IT16 的倍数（10i…1000i），一致。另 Wikipedia“IT Grade”条目给出“IT6 起每隔 5 级乘 10”的规律，与倍数表相符。"
  - "公式自检（本工作用上面公式重算，与表值比较）：>3 mm 的 12 行中，IT5–IT18 的表值与“倍数×i”相差都在 ±5% 以内，只有 3–6 mm 的 IT6（8 对 7.33，+9.2%）和 10–18 mm 的 IT5（8 对 7.58，+5.6%）超出；≤3 mm 一行按 D=√(1×3) 计算时偏差达 +15%（D 取 1 是本工作的假设，标准对首段的处理未在所读出处中见到）。所以教学和计算一律查表，公式只用来讲规律、不用来代替表值。"
  - "等级规律（可用于自检）：从 IT6 起，每隔 5 级公差乘 10（如 80–120 mm：IT6=22 μm，IT11=220 μm，IT16=2200 μm），各行均成立。"
  - "适用：GB/T 1800.1-2020 修改采用 ISO 286-1:2010，表1 数值与 ISO 286-1 相同（s1 为 GB 转载，s3 为 ISO 286 转载，两者一致）。"
