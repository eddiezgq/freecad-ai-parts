# 键槽铣夹具 JJ-301-50（SH-301 工序 50 铣键槽）——夹具设计数据（第 13 轮，配教材第 52 章）。
# 书里的夹具总图、夹紧力计算、精度预算与数字工厂 AI 评审员的夹具检查都读这份数据（hub/fixture.py）。
# 数值是教学设计值；标准件代号按 JB/T 8004–8045 的分类写，具体规格写作时核对现行标准。
id: JJ-301-50
name: 键槽铣夹具
name_en: Keyway milling fixture
part: SH-301
op: 50
machine: 键槽铣床 KEY-01（工作台 T 形槽宽 18 mm）
version: A
designer: 工艺员
date: 2026-10-03

locating:
  scheme: 齿轮位外圆放在 V 形块上（V 形块工作面分前后两段，相当于两个短 V 形块，限制 4 个自由度），左轴肩靠挡板（限制 1 个）
  alpha: 90
  v_land: 18            # V 形块每段工作面的长度
  v_span: 60            # 两段工作面外端之间的距离（= 齿轮位长度）
  Td: 0.039
  dof: 5

cutting:                # 与工艺规程工序 50 工步 3 一致（程序核对）
  tool: 键槽铣刀 Ø12（两刃，螺旋角约 30°）
  D: 12
  z: 2
  fz: 0.03
  ap: 1.03
  vc: 25
  material: "45"
  feed_toward_stop: true  # 进给方向朝向轴向挡板：轴向切削力由挡板承受，不靠摩擦

safety: {K1: 粗加工, K2: 铣削, K3: 断续, K4: 手动, K5: 方便, K6: 支承点接触}   # 键槽在实心料上分层铣出，按粗加工；V 形块为线接触，K6 = 1.0

clamping:
  type: 两个移动压板（螺柱在中间，一端压工件、一端支在可调支承上），左压板压左轴端 Ø30、右压板压右轴承位 Ø35.3，离 V 形块两段工作面的外端各 20 mm，对称布置
  r_f: 20.15            # 横向切削力对轴心的力臂（取齿轮位半径，偏于安全）
  r_c: 16.3             # 压板处摩擦力的作用半径（Ø30 与 Ø35.3 的平均半径）
  r_v: 20.15            # V 形块工作面处摩擦力的作用半径
  count: 2
  mu1: 0.16             # 压板与工件（钢—钢，有切削液，教学取值）
  mu2: 0.16             # V 形块与工件
  G: 20                 # 工件重力约 2 kg
  axial_stop_takes_Fx: true
  thread_d: 10
  thread_P: 1.5
  mu_thread: 0.15
  mu_end: 0.15
  r_end: 6.75           # 螺母压在球面垫圈的平面上：支承面当量摩擦半径 ≈ (s + d_h)/4 = (16 + 11)/4
  hand_force: 50        # 用定扭矩扳手拧到 5 N·m（50 N × 100 mm），避免夹紧力过大、各次不一致
  wrench: 100
  l_work: 40            # 螺栓到压工件一端
  l_heel: 50            # 螺栓到后支点
  strap: {b: 32, h: 14, slot_w: 11, material: 45 钢 调质}

pneumatic:              # 改为机器人上下料时的气动方案（52.5 节）
  p_min: 0.4
  eta: 0.85

setting:
  block: 直角对刀块（内直角：侧面对键槽中心，内角底面即深度对刀面对槽底；铣刀放进内角一次对好两个方向），用 3 mm 塞尺
  feeler: 3
  side_from_v_plane: 9  # 对刀块侧面到 V 形块对称面的距离 = 刀具半径 6 + 塞尺 3（名义值）
  side_tol: 0.005       # 对刀块侧面位置公差 ±0.005
  top_from_v_apex: 40.38  # 对刀块深度对刀面（内角底面）到 V 形块两工作面交线（理论顶点）的高度：按 H 和齿轮位直径的中值、塞尺 3 mm 算出（程序 52.6.1 核对）
  top_tol: 0.01

keys:
  slot: [18, 0.027, 0]   # 机床 T 形槽 18 H8
  key: [18, 0, -0.027]   # 定位键 18 h8
  spacing: 200
  one_side: true          # 安装夹具时两个键都靠向 T 形槽的同一侧

requirements:            # 夹具总图上的技术要求
  - V 形块对称面对定位键侧面的平行度 0.01/100（装上机床后再用检验棒找正，见维护规程）
  - V 形块对称面对夹具体底面的垂直度 0.01/100
  - V 形块两段工作面的轴线（检验棒轴线）对夹具体底面的平行度 0.01/100
  - 对刀块侧面到 V 形块对称面的距离 9 ± 0.005（对检验棒测量）
  - 对刀块深度对刀面（内角底面）到 V 形块理论顶点的高度 40.38 ± 0.01（用检验棒间接测量）
  - V 形块工作面渗碳淬火 58–62 HRC，挡板淬火 55–60 HRC；V 形块、挡板磨损超过 0.005 时更换（见维护规程）
  - 用 Ø40.3 检验棒和首件试切验收；首件三坐标检验键槽对称度和 H

parts:                   # 明细栏（序号、名称、数量、材料、标准或图号、备注）
  - [1, 夹具体, 1, HT200, JJ-301-50-01, 时效处理]
  - [2, 定位键, 2, 45, JB/T 8016 类, 18 h8]
  - [3, V 形块, 1, 20Cr, JJ-301-50-03, 渗碳淬火 58–62 HRC，两段工作面]
  - [4, 轴向挡板, 1, T8, JJ-301-50-04, 淬火 55–60 HRC]
  - [5, 移动压板, 2, 45, JB/T 8010 类, 调质]
  - [6, 可调支承（压板后支点）, 2, 45, JB/T 8026 类, ""]
  - [7, 双头螺柱 M10, 2, 45, GB/T 898, 拧入铸铁夹具体 bm = 1.25d，8.8 级]
  - [8, 球面垫圈与锥面垫圈, 2, 45, GB/T 849/850, ""]
  - [9, 弹簧, 2, 65Mn, "", 松开时把压板顶起]
  - [10, 对刀块, 1, 20, JB/T 8031 类, 渗碳淬火 58–64 HRC]
  - [11, 螺钉与圆柱销, 若干, "", GB/T 70.1、GB/T 119, 固定 V 形块、挡板、对刀块]
  - [12, 塞尺 3 mm, 1, "", JB/T 8032 类, 随夹具]
  - [13, T 形槽用螺栓 M16 与螺母, 2, 45, GB/T 37, 经夹具体两端的 U 形耳座压紧在工作台上]

budgets:                 # 夹具精度预算（52.9 节）：ΔD 定位、ΔJ 夹具制造、ΔA 夹具安装、ΔT 对刀调整、ΔG 加工过程（留给机床刀具）
  - what: 键槽对称度 0.02
    T: 0.02
    method: rss
    items: {ΔD: 0.006, ΔJ: 0.0, ΔA: 0.0045, ΔT: 0.008, ΔG: 0.008}   # ΔJ：夹具上的常值位置误差由找正和首件试切调整吸收；ΔA：检验棒找正残差 0.01/100 在 45 mm 键槽上的歪斜；ΔT：首件试切后微调，剩余 ±0.004
  - what: 槽底尺寸 H（公差 0.17）
    T: 0.17
    method: extreme
    items: {ΔD: 0.0081, ΔJ: 0.02, ΔA: 0.005, ΔT: 0.03, ΔG: 0.05}

maintenance:
  - [每班, 清理 V 形块和挡板上的切屑，检查压板弹簧]
  - [每 500 件或每月, 用 Ø40.3 检验棒和千分表检查 V 形块对称面、对刀块位置；磨损 > 0.005 更换]
  - [每次装上机床, 定位键靠向 T 形槽同一侧，用检验棒找正 V 形块对称面与工作台进给方向平行（0.01/100）]
  - [对称度 SPC 出现连续 7 点上升或超差, 停用检查定位元件磨损（第 58 章问题情景“键槽夹具定位元件磨损”）]
