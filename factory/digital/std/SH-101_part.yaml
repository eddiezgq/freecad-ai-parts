# SH-101 输入齿轮轴（WQR-105 减速器）的零件图要求——工艺规程评审用的“图纸”（第 13 轮十二，配《机械制造技术》第 56 章）。
# 学生在数字工厂里给 SH-101 写工艺规程时，AI 工艺评审员以本文件为准核对图纸要求（学生的工艺规程里写的 drawing、characteristics
# 不能放宽图纸）。数字工厂经 /api/process/part/SH-101 把它给学生下载。这里没有工艺路线：路线由学生拟定（任务单 TS-56-1）。
# 尺寸与 WQR-105 一致：齿轮 m2 z24（factory/data.py GEARS），轴承 6205（Ø25），轴伸键 6×6×25（BOM SA-100），
# 轴承位 Ø25 k6 与检验模板“零件检验-输入齿轮轴”一致，磨后渗碳层深度与 std/WQR-105_chains.yaml 一致。其余为教学设计值（A 版）。
item: SH-101
part_name: 输入齿轮轴
drawing_no: WQR105-101
revision: A
material: 20CrMnTi
heat_treatment:
  kind: carburize            # 渗碳淬火、低温回火
  spec: "渗碳淬火 + 180 ℃ 回火：齿面与轴承位表面 58–62 HRC，心部 30–45 HRC；有效硬化层深度（磨后）0.8–1.2 mm"
  ground_after: [轴承位]     # 热处理后必须磨的表面（尺寸 IT6、Ra 0.8，淬硬后车不动）
annual_volume: 6000          # 年产量（件），WQR-105 按年 6000 台（教学设定）
batch: 100                   # 生产批量（件）
part:
  kind: shaft
  segments:                  # 从左到右 (直径, 长度, 名称)；齿轮段的直径写齿顶圆
    - [20, 36, 轴伸]
    - [24, 20, 密封轴颈]
    - [25, 17, 左轴承位]
    - [30, 8, 左轴肩]
    - [52, 30, 齿轮]
    - [30, 8, 右轴肩]
    - [25, 17, 右轴承位]
  chamfer_mm: 1.0
  keyway: {segment: 0, b: 6, t: 3.5, L: 25, offset_mm: 5.5}
  center_hole: B2.5/8（GB/T 145，热处理后修研，保留）
  gear: {m: 2, z: 24, alpha_deg: 20, x: 0, b_mm: 30, d_mm: 48, da_mm: 52, df_mm: 43, grade: "8（GB/T 10095.1）", W_k: 3}
  mass_kg: 0.80
blanks:                      # 可选的毛坯（第 56.3 节比较）；学生在工艺规程的 blank 里选一种并写明
  - {kind: 热轧圆钢, spec: Ø60, material_item: RM-20CR-D60, note: 工厂现用；锯切下料}
  - {kind: 模锻件, spec: 按毛坯图（GB/T 12362 普通级）, note: 需正火；批量大时材料利用率高}
drawing:                     # 有尺寸公差的外圆（评审员逐个核对最后一道工序尺寸与粗糙度）
  - {name: 轴承位, size_mm: 25, es_mm: 0.015, ei_mm: 0.002, Ra_um: 0.8}
  - {name: 轴伸, size_mm: 20, es_mm: 0.009, ei_mm: -0.004, Ra_um: 1.6}
  - {name: 密封轴颈, size_mm: 24, es_mm: 0, ei_mm: -0.033, Ra_um: 0.8}
  - {name: 齿顶圆, size_mm: 52, es_mm: 0, ei_mm: -0.19, Ra_um: 3.2}
characteristics:
  - {id: C1, name: 轴承位直径（两处）, spec: "Ø25 k6（+0.015/+0.002）", nominal: 25, es: 0.015, ei: 0.002, kind: dim, key: true, qms: 轴承位直径 Bearing seat Ø25 k6 (mm)}
  - {id: C2, name: 轴伸直径, spec: "Ø20 j6（+0.009/−0.004）", nominal: 20, es: 0.009, ei: -0.004, kind: dim, key: true}
  - {id: C3, name: 密封轴颈直径, spec: "Ø24 h8（0/−0.033），Ra 0.8 μm（油封唇口接触面）", nominal: 24, es: 0, ei: -0.033, kind: dim}
  - {id: C4, name: 键槽宽, spec: "6 N9（−0.004/−0.034）", nominal: 6, es: -0.004, ei: -0.034, kind: dim}
  - {id: C5, name: 键槽深（d − t₁）, spec: "16.5（0/−0.1）", nominal: 16.5, es: 0, ei: -0.1, kind: dim}
  - {id: C6, name: 键槽对称度, spec: "0.015（对轴伸轴线）", kind: geo}
  - {id: C7, name: 轴承位径向圆跳动, spec: "0.010（对 A–B 公共轴线）", kind: geo, key: true}
  - {id: C8, name: 齿顶圆径向圆跳动, spec: "0.03（对 A–B 公共轴线）", kind: geo}
  - {id: C9, name: 齿轮精度, spec: "8 级（GB/T 10095.1）；公法线长度 W₃ = 15.433（−0.050/−0.100）", nominal: 15.433, es: -0.05, ei: -0.10, kind: gear, key: true, qms: 公法线长度 W3 Span measurement (mm)}
  - {id: C10, name: 表面粗糙度, spec: "轴承位、密封轴颈 Ra 0.8 μm；齿面、轴伸 Ra 1.6 μm；其余 Ra 3.2 μm", kind: rough}
  - {id: C11, name: 齿面与轴承位硬度, spec: "58–62 HRC", kind: hard, key: true, qms: 齿面硬度 Tooth hardness (HRC)}
  - {id: C12, name: 有效硬化层深度（磨后）, spec: "0.8–1.2 mm", kind: hard, key: true}
  - {id: C13, name: 心部硬度, spec: "30–45 HRC", kind: hard}
  - {id: C14, name: 总长与各段长度, spec: "136；未注公差按 GB/T 1804-m", nominal: 136, es: 0.5, ei: -0.5, kind: dim}
  - {id: C15, name: 倒角与中心孔, spec: "未注倒角 C1；两端中心孔 B2.5（GB/T 145）保留", kind: other}
  - {id: C16, name: 表面缺陷, spec: "磨削表面不得有烧伤、裂纹（酸洗检查）", kind: other}
