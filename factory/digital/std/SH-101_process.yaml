        - {kind: dia, seg: 1, text: "Ø24 h8（0/−0.033）"}
        - {kind: dia, seg: 2, text: "Ø25 k6（+0.015/+0.002）"}
        - {kind: dia, seg: 6, text: "Ø25 k6（+0.015/+0.002）"}
