      - {char: "径向跳动（两中心孔间，轴承位、齿轮处）≤ 0.20，即弯曲 ρ ≤ 0.10（磨削余量按此计算）", gauge: G06, freq: 每炉抽 5 件；超差件隔离评审（淬硬件不做冷校直）}
      - {char: "轴伸处径向跳动 ≤ 0.02（键槽深尺寸链的同轴度环）", gauge: G06, freq: 每炉抽 5 件}
  - seq: 70
    operation: 磨外圆 Cylindrical grinding
    workstation: 外圆磨床 GRD-01
    shop: 机加
    content: 修研两端中心孔；两顶尖装夹，粗磨、精磨两处轴承位、密封轴颈和轴伸至图纸尺寸；酸洗检查烧伤
    datum: 两端中心孔（精基准）
    clamping: 两顶尖，端面拨动顶尖带动
    tools: 白刚玉砂轮 WA60KV
    features:
      - {name: 轴伸, size_mm: 20, es_mm: 0.009, ei_mm: -0.004, Ra_um: 1.6}
