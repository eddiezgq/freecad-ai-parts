      - {step: 2, content: 粗磨两处轴承位、密封轴颈、轴伸，直径留精磨量 0.04, tool: T06, op: grind, note: "砂轮 35 m/s，工件 15 m/min，横进给 0.002 mm/行程", tb_min: 6.5}
      - {step: 3, content: 修整砂轮（每 10 件）, tool: 金刚石笔, ta_min: 0.3}
      - {step: 4, content: 精磨至 Ø25 k6、Ø24 h8、Ø20 j6，Ra 0.8（轴伸 Ra 1.6），光磨 2 次, tool: T06, op: grind, note: "横进给 0.0015 mm/行程", gauge: G05, tb_min: 3.8}
      - {step: 5, content: 抽件酸洗检查烧伤, ta_min: 0.5, gauge: G14}
