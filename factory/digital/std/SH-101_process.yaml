    shop: 机加
    content: 以两端中心孔（心轴架）定位，滚齿 m2 z24，按 7 级加工（渗碳淬火后约降一级，达到图纸 8 级）；齿端倒棱去毛刺
    datum: 两端中心孔（精基准）
    clamping: 上下顶尖，拨盘
    tools: m2 单头滚刀 Ø63
    minutes: 8
    setup_min: 40
    coolant: 切削油
    aux: [去毛刺（齿端倒棱）]
    fixture: 滚齿心轴架（上下顶尖）、拨盘
