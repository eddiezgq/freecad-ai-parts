    locate: [{surface: 左端中心孔, symbol: center_fixed, dof: 3}, {surface: 右端中心孔, symbol: center_fixed, dof: 2}]
    clamp: [{surface: 左端面（端面拨动顶尖的拨爪）, kind: manual}]
    sketch:
      stock: [[20, 36], [24, 20], [25, 17], [30, 8], [52, 30], [30, 8], [25, 17]]
      machined: [0, 1, 2, 6]
      dims:
