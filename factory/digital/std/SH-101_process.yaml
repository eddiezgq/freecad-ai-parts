      machined: [0, 1, 2, 3, 4, 5, 6, end_L, end_R]
      dims:
        - {kind: dia, seg: 0, text: "Ø20.4 0/−0.05"}
        - {kind: dia, seg: 1, text: "Ø24.4 0/−0.05"}
        - {kind: dia, seg: 2, text: "Ø25.4 0/−0.05"}
        - {kind: dia, seg: 4, text: "Ø52 h11（0/−0.19）"}
        - {kind: dia, seg: 6, text: "Ø25.4 0/−0.05"}
        - {kind: length, from: 0, to: 136, text: "136±0.05"}
