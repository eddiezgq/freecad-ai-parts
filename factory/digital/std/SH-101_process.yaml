        - {kind: dia, seg: 1, text: "Ø25.5 0/−0.2"}
        - {kind: dia, seg: 2, text: "Ø26.5 0/−0.2"}
        - {kind: dia, seg: 4, text: "Ø53.5 0/−0.3"}
        - {kind: dia, seg: 6, text: "Ø26.5 0/−0.2"}
        - {kind: length, from: 0, to: 137, text: "137±0.2"}
