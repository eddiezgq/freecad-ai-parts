      - {char: "Ø25.5、Ø26.5、Ø31.5（0/−0.2）", gauge: G04, freq: 首件、每 10 件}
      - {char: "齿顶圆 Ø53.5（0/−0.3）", gauge: G16, freq: 首件、每 10 件}
      - {char: 中心孔 B2.5 完整、无毛刺, gauge: 目测, freq: 每件}
  - seq: 30
    operation: 精车 Finish turning
    workstation: 数控车床 CNC-L01
    shop: 机加
    content: 两顶尖装夹，半精车轴承位、密封轴颈、轴伸至磨前尺寸，车齿顶圆、轴肩、端面和倒角到尺寸；两端面用半缺顶尖车至总长 136，左轴承定位轴肩到齿轮左端面 8 直接控制
    datum: 两端中心孔（精基准）
    clamping: 两顶尖，鸡心夹头
    tools: 外圆车刀 DNMG 110404（涂层硬质合金）
    cut: {vc_m_min: 150, f_mm_r: 0.15, ap_mm: 0.75, d_mm: 53.5, length_mm: 32, passes: 8}
    features:
      - {name: 轴伸, size_mm: 20.4, es_mm: 0, ei_mm: -0.05, Ra_um: 3.2}
      - {name: 密封轴颈, size_mm: 24.4, es_mm: 0, ei_mm: -0.05, Ra_um: 3.2}
