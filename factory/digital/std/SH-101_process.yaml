      machined: [4]
      dims:
        - {kind: dia, seg: 4, text: "m2 z24，W₃ 15.433（−0.050/−0.090）"}
      ra: {seg: {4: 1.6}}
    steps:
      - {step: 1, content: 两顶尖装夹在心轴架上，拨盘带动，找正齿顶圆跳动 ≤ 0.02, ta_min: 1.2, gauge: G06}
      - {step: 2, content: "一次滚到全齿深（m2 小模数），滚刀 vc 40 m/min（n ≈ 202 r/min，工件 n ≈ 202/24 ≈ 8.4 r/min），轴向进给 1.25 mm/工件转；行程 = 齿宽 30 + 切入 16 + 切出 3 = 49 mm，tb = 49/(1.25 × 8.4) ≈ 4.7 min", tool: T04, tb_min: 4.7, gauge: G07}
