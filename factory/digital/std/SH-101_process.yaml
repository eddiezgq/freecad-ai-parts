    steps:
      - {step: 1, content: 两顶尖装夹（鸡心夹头夹轴伸 Ø21.5，垫铜皮），换半缺顶尖车右端面，以左端面为测量基准保证 136.5±0.1；精车齿顶圆至 Ø52 h11、右轴肩至 Ø30、右轴承位至 Ø25.4，以右端面为基准车齿轮右端面（25±0.05）和右轴肩（17±0.05），倒角 C1, tool: T02, op: turn,
         passes_detail: [[53.5, 0.75, 32], [31.5, 0.75, 10], [26.5, 0.55, 19]], vc: 150, f: 0.15, gauge: G16}
