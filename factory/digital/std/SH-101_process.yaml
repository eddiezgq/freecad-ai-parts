         passes_detail: [[60, 1.625, 57], [56.75, 1.625, 57], [53.5, 2.5, 27], [48.5, 2.5, 27], [43.5, 2.5, 27], [38.5, 2.5, 27], [33.5, 1.0, 27], [31.5, 2.5, 19]], vc: 120, f: 0.3, gauge: G16}
      - {step: 4, content: 安装 2：调头，三爪卡盘短夹持 Ø53.5 齿顶圆（垫铜皮），车左端面（分 2 刀），保证总长 137±0.2, tool: T01, op: face, d: 60, vc: 120, f: 0.2, ap: 1.25, passes: 2, gauge: G02}
      - {step: 5, content: 钻左端中心孔 B2.5, tool: T03, op: drill, d: 2.5, vc: 20, f: 0.04, depth: 6}
