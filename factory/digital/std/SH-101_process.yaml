    inspect:
      - {char: "公法线 W₃ 15.433（−0.050/−0.090）", gauge: G07, freq: 首件、每 10 件}
      - {char: "齿圈径向跳动（按 7 级）", gauge: G06, freq: 首件、每 20 件}
  - seq: 50
    operation: 铣键槽 Keyway milling
    workstation: 键槽铣床 KEY-01
    shop: 机加
    content: 以轴伸外圆在 V 形块上定位（与键槽对称度的基准一致），轴承位外圆辅助支承，铣轴伸键槽 6 N9×25，控制槽底到精车外圆下母线的尺寸 H = 16.7（−0.04/−0.085），渗碳淬火、磨削后得 d − t₁ = 16.5（0/−0.1）；去毛刺
    datum: 轴伸外圆（V 形块）
    clamping: V 形块，压板
    tools: 键槽铣刀 Ø6
    minutes: 5.5
    setup_min: 20
    coolant: 乳化液
    fixture: 键槽铣夹具（两个短 V 形块、轴向挡板、压板）
    aux: [去毛刺]
    locate_check: {method: v_block, Td: 0.05, alpha: 90, measure: bottom, tol: 0.06, what: 槽底尺寸 H（以轴伸外圆下母线为工序基准）}
    locate: [{surface: 轴伸外圆, symbol: v, dof: 4}, {surface: 密封轴颈轴肩, symbol: plane, dof: 1}]
    clamp: [{surface: 轴伸、轴承位（压板）, kind: manual}]
    sketch:
      stock: [[20.4, 36], [24.4, 20], [25.4, 17], [30, 8], [52, 30], [30, 8], [25.4, 17]]
      machined: [keyway]
      dims:
        - {kind: keyway_width, text: "6 N9（−0.004/−0.034）"}
        - {kind: keyway_length, text: "25"}
        - {kind: keyway_depth, text: "H 16.7（−0.04/−0.085）"}
        - {kind: keyway_pos, text: "5.5"}
      ra: {keyway: 3.2}
    steps:
      - {step: 1, content: 轴伸外圆放入 V 形块，密封轴颈轴肩靠挡板，压板压紧, ta_min: 1.0}
      - {step: 2, content: 对刀（对中心、对槽底）；首件试切后用对称度检具测量并微调, ta_min: 0.8, gauge: G10}
      - {step: 3, content: 分 5 层铣键槽（每层约 0.74 mm）至 H 16.7, tool: T05, op: keyway, d: 6, vc: 20, fz: 0.02, z: 2, layers: 5, ap_layer: 0.74, travel: 21}
      - {step: 4, content: 去毛刺, ta_min: 0.4}
    inspect:
      - {char: "键槽宽 6 N9（C4）", gauge: G08, freq: 每件}
      - {char: "槽底尺寸 H 16.7（−0.04/−0.085）", gauge: G09, freq: 首件、每 5 件}
      - {char: "键槽对称度 0.015（C6）", gauge: G10, freq: 首件、每 10 件}
  - seq: 60
    operation: 渗碳淬火 Carburizing
    workstation: 热处理炉 HT-01
    shop: 热处理
    content: 清洗；920 ℃ 渗碳，有效硬化层深度 1.1–1.3 mm（磨前，按 GB/T 9450 测到 550 HV 处）；直接淬火，180 ℃ 回火 2 h；表面 58–62 HRC，心部 30–45 HRC；清洗、喷丸清理氧化皮
    minutes: 20
    setup_min: 60
    card: 热处理工艺卡 RCL-SH101（另编）
    aux: [清洗（淬火前后）, 喷丸清理氧化皮]
    inspect:
      - {char: "表面硬度 58–62 HRC（C11）", gauge: G12, freq: 每炉抽 3 件}
