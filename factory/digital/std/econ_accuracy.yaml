excluded:
  - "外圆 粗磨、精磨、研磨、超精加工：只有 s3 方案表一处（读两遍一致）：粗车-半精车-磨削 IT7-6 / Ra0.8-0.4；…-粗磨-精磨 IT7-6 / Ra0.4-0.1；…-粗磨-精磨-超精加工（或轮式超精磨）IT5 / Ra0.1-0.012；…-超精磨（或镜面磨）IT5以上 / Ra0.025-0.006；…-精磨-研磨 IT5以上 / Ra0.1-0.012。s1 只给“中心磨削 IT6~IT8、Ra0.8~0.1”“无心磨 IT6~IT7、Ra0.8~0.2”，与 s3 对不上，s2 无磨削数据。缺第二处一致读数，不收，上列数值只作待核线索。"
  - "孔 粗铰、精铰：s4、s5 都不分粗/精；铰孔整体 s4 为 IT9~IT6、Ra3.2~0.2，s5 为 IT9~IT7、Ra3.2~0.8，互相不一致，不收。"
  - "孔 粗镗、半精镗、精镗：只有 s4（粗镗 IT13~IT12 Ra12.5~6.3；半精镗 IT10~IT9 Ra6.3~3.2；精镗 IT8~IT7 Ra1.6~0.8）；s5 只说“镗孔 IT9～IT7”，不收。"
  - "孔 拉 的 Ra：s4 为 1.6~0.4，s5 为 6.3~1.6，矛盾，只收 IT。"
  - "孔 珩 的 Ra 下限：s4 为 0.05，s5 为 0.025，只收上限 0.2。"
  - "孔 粗磨、精磨（内圆磨）：只有 s4“磨孔 IT8~IT6、Ra0.8~0.4”，不分粗精，单一出处，不收。"
  - "平面 粗铣、精铣、刨、粗磨、精磨、刮研：能打开的网页只有“车铣刨磨钻镗最高精度”类文章（搜狐 302093609、博客园 josephcnblog 9881325、搜狐 328788288 等，同一原文，数值如“粗车 Ra20—10”“精铣 IT16—IT8”明显是旧光洁度换算或错字），国际金属加工网《平面加工方法和平面加工方案》有验证码打不开，均不收。"
  - "李益民《机械制造工艺设计简明手册》表 1.4-6/1.4-7/1.4-8、王先逵《机械制造工艺学》、《机械加工工艺手册》原表：本次没有读到可信转载。嘉立创/机械工程师设计手册“切削加工的经济精度”页（https://www.jlc-jdgf.com/mcbook/new02099.htm）是按 IT 列打点的表，抓取工具两次读出的格位不一致，只确认它不含 Ra，不收。原创力文档 max.book118 两份“各种加工方法的经济精度与表面粗糙度”只预览到孔的 IT 表（如粗铰 IT9、精铰 IT7~8、细镗 IT6~7），没有 Ra，也不收。"
  - "英文对照：ANSI B4.1 “Relation of machining processes to tolerance grades” 图在 roymech、brainly 页面上数据格为空；utec.co、firatbc.com 等厂商页面数值互相不一致且无原始出处，没有用作核对源。Kalpakjian/Groover 原图未取得。"
notes:
  - "出处性质：本表各行来自网络转载的国内教材通用数据（外圆加工方案表与逐方法叙述），不是标准，也未能对到手册原表号。两个出处数值一致才收；s5 与 OFweek、搜狐 462224668 是同一篇文章，只算一处。s1、s2、s3 也很可能同源于同一教材，“两处一致”只能排除转载错字，不能排除原书差异。正式出版前应拿李益民《简明手册》表 1.4-6～1.4-8 纸本逐格复核。"
  - "粗车 Ra：s1、s3 为 12.5~50，s2 为 12.5~30；取 12.5~50（两处一致），s2 视为转载差异。"
  - "IT 用 IT_min（精者）~IT_max（粗者）；Ra 用 μm，Ra_min~Ra_max。经济精度指正常生产条件（合格设备、标准技术等级工人、不延长工时）下能经济达到的范围，不是极限精度。"
  - "适用范围（s3 方案表）：车削方案适用于淬火钢以外的各种金属；精细车（金刚石车）主要用于有色金属；淬火钢外圆应安排磨削。"
  - "SH-301（45 钢台阶轴）轴承轴颈通常要求 IT6 左右、Ra0.8 以下，已超出本表精车（IT7~8、Ra0.8~1.6）范围，需磨削；磨削行待补。"
  - "行缺 Ra 列（拉、珩）表示该列未收，不是零。"
