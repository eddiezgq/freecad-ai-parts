excluded:
  - "EN-GJL-200（HT200 / GG20）：s1 的 h=1.0 mm 一格两遍都读成“120”（明显是抽取丢位）；由同行 mc=0.25 和 h=0.1 列 1810 反推约 1020，但属推算，不收。HT200 请暂用 GJL150/GJL250 两行或 s3 的 MD15。"
  - "40Cr / 41Cr4、20CrMnTi：没找到可读的出处给出这两个牌号的 kc1.1；只能用 s3 的低合金钢组（MD06/MD07）或 s1 的 34CrMo4、20MnCr5 近似。"
  - "Ti6Al4V、304 的牌号级数值：没找到牌号级出处，只收 s3 的材料组（MD37、MD14）和 s4 粗分类。"
  - "s1 的 E 360 与 18 Cr Ni 6 两行：mc、kc 全列逐格相同（2260/0.30），疑为抽取串行，不收；55 Ni Cr Mo V 6 N 用不到，不收。"
  - "s1 的 Al-Sn-Legierungen（与 S235JR 同为 1780/0.17，疑串行）、Al-Zn-Legierungen、Mg-Legierungen：可疑或用不到，不收；铝合金用 s3。"
  - "s4 的 high-carbon unalloyed、high-alloy tool steel、Al>99%、Ti>99% 四行：只有一个粗略出处、条件不明，不收。"
  - "S235JR 的 h=0.1 列：读数 2730，而 1780·0.1^-0.17 ≈ 2633（偏 3.6%），且 s1 的 Al-Sn 行同列读成 2630，疑两行串格，h=0.1 一格不收（kc1.1、mc、h=0.4 与公式一致，保留）。"
  - "s5 的 CuZn35Pb2、CuTeP：只在一遍中出现完整条件，不收。"
  - "Sandvik Coromant 官方 kc1 / mc 表（含 kc 0.4 口径）：官网页面靠 JavaScript 渲染、取不到正文；找到的两份 Sandvik 样本 PDF（2015 车削 I 章、铣削 D 章）里没有该表。所以本表没有 Sandvik 原始数据，s4 只是 Wikipedia 转述。"
  - "Klocke《Manufacturing Processes 1: Cutting》/ König–Klocke、Tschätsch 原书表：在网上没有可读全文，未用。"
  - "刀具磨损修正、刀具材料修正（如陶瓷 0.9）：s2 只在例题中提到“陶瓷刀具 C1=0.9”，没有成表，不收进数值列。"
notes:
  - "公式：Fc = b·h·kc，kc = kc1.1·h^-mc（h 为切削厚度 mm，b 为切削宽度 mm）。s2 写作 kc = kc1.1/h^mc·C1·C2；s1 写作 Fc = A·kc·K。"
  - "参考条件 R1（s1 原文）：HM（硬质合金）刀具，vc = 100…120 m/min，α0 = 5°，γ0 = 6°（长屑材料）/ γ0 = 2°（短屑材料，如铸铁），κr = 60°。s1 的切削速度修正系数 K：vc >10…30 m/min 取 1.25，>30…80 取 1.1，>80 取 1.0。"
  - "参考条件 R3（s3 原文）：h = 1 mm、b = 1 mm、前角 0°；前角修正 kc = kc1.1·h^-mc·(1 − 0.01·γ)，即每 1° 前角约 1%。注意 s1（γ=6°）与 s3（γ=0°）的口径不同，同一钢种 s1 的值普遍高于 s3，不要把两组混在一个计算里。"
  - "参考条件 R4（s4）：只说明“参考刀具有一定前角、在一定切屑厚度下”，未给具体值，粗略参考。"
  - "参考条件 R5（s5 表 2 条件 1）：车削，HM-K10，vc = 180 m/min，f = 0.05–0.315 mm，ap = 2.5 mm，前角 6°/8°/10°（按组）。CuZn37 的试验条件两遍读取不一致（一遍说 HSS/HM、vc=32 m/min，一遍说条件 1），数值本身一致，条件存疑。s5 给的是 1−mc，本表 mc = 1 − (1−mc)，只做这一步换算。"
  - "s1 的 kc_h01、kc_h04 两列是原表直接读数，可用来检验 kc1.1·h^-mc 的计算；已逐行验算：除下面说的 S235JR 外，所有 s1 行 kc1.1·h^-mc 与原表 h=0.1、0.4 列偏差都在 0.7% 以内（最大 GJS400，h=0.4 偏 −0.65%）。"
  - "s1 的 GJS600（mc=0.48）、GJS800（mc=0.44）mc 明显大于其他铸铁，但各 h 列与公式自洽，照录，使用时注意。"
  - "s1 未给钢的热处理状态；45 钢正火与调质的区别 s1 没有，s3 只有 02/03/05 组（03 组状态描述存疑）。"
  - "教材用法：例题算切削力时，固定用一个出处（建议 s1 配 R1 条件）；讲“不同手册数值差 20% 以上”时可拿 s1 与 s3、s4 对比。"
