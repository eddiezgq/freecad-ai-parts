      - {step: 3, content: 调头（鸡心夹头夹右轴端，垫铜皮），精车左轴承位至 Ø35.3、左轴端至 Ø30 h8，换半缺顶尖车左端面保证总长 167±0.2，以左端面为基准车左侧两轴肩（40±0.05、52±0.05），倒角 C1.5, tool: T02, op: turn,
