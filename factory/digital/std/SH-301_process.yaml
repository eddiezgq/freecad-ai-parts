# SH-301 输出轴机械加工工艺规程（第 13 轮：《机械制造技术》第 50、57、59 章样例；数字工厂测试与 AI 工艺评审员的参照）
# 本文件是原件（不是从教材同步来的副本）。图纸要求取自工厂数据的检验模板“零件检验-输出轴”，其余特性按 A 版图纸补全。
# 余量和中间工序尺寸按“企业工艺标准”取值：教学示意值，不是国家标准。
#
# 数据格式 v2（第 13 轮 7.3（4）N1）：v1 的字段（material、blank、drawing、operations 的 seq/operation/workstation/content/
# datum/clamping/tools/cut/features/minutes）不变（features 仍只列轴承位、齿轮位：数控程序生成按它编程，轴端 Ø30 h8 先只进图纸特性 C3 和工序简图），AI 工艺评审员和车间执行照旧使用；v2 新增 doc（文件头与签署）、part（零件轮廓，
# 画工序简图用）、characteristics（图纸全部特性，检验卡逐条覆盖）、tool_list（刀具卡）、gauges（量具），以及每道工序的
# setup_min（准备与终结时间）、shop（车间）、fixture、coolant、locate/clamp（定位与夹紧，GB/T 24740 符号）、sketch（工序简图）、
# steps（工步）、inspect（本工序检验项目）。工艺文件生成器（hub/cards.py）由这一份数据生成过程卡、工序卡、检验卡和刀具卡。
