        - {kind: dia, seg: 1, text: "Ø36.5 0/−0.25"}
        - {kind: dia, seg: 2, text: "Ø41.5 0/−0.25"}
        - {kind: dia, seg: 3, text: "Ø36.5 0/−0.25"}
        - {kind: dia, seg: 4, text: "Ø31.5 0/−0.25"}
        - {kind: length, from: 0, to: 168, text: "168±0.2"}
      ra: {all: 12.5}
    steps:
      - {step: 1, content: 安装 1：三爪卡盘短夹持毛坯左端外圆（夹持长约 15，端面靠卡爪），车右端面，车去约 7（分 4 刀）, tool: T01, op: face, d: 50, vc: 120, f: 0.2, ap: 1.75, passes: 4, gauge: G02}
      - {step: 2, content: 钻右端中心孔 A3.15, tool: T03, op: drill, d: 3.15, vc: 20, f: 0.05, depth: 7, gauge: G02}
      - {step: 3, content: 回转顶尖顶右端中心孔（一夹一顶），粗车齿轮位一带至 Ø41.5（车到左轴承位左端），右轴承位至 Ø36.5，右轴端至 Ø31.5；轴肩按工艺尺寸跟踪图留轴向余量 0.8, tool: T01, op: turn,
         passes_detail: [[50, 2.125, 130.5], [45.75, 2.125, 130.5], [41.5, 2.5, 58.5], [36.5, 2.5, 33.5]], vc: 120, f: 0.3, gauge: G03}
      - {step: 4, content: 安装 2：调头，三爪卡盘短夹持 Ø41.5 齿轮位外圆（垫铜皮，轴肩靠卡爪），车左端面（分 4 刀，试切：用卡尺以右端面为测量基准量总长），保证总长 168±0.2, tool: T01, op: face, d: 50, vc: 120, f: 0.2, ap: 1.75, passes: 4, gauge: G02}
      - {step: 5, content: 钻左端中心孔 A3.15, tool: T03, op: drill, d: 3.15, vc: 20, f: 0.05, depth: 7}
      - {step: 6, content: 回转顶尖顶左端中心孔，粗车左轴承位至 Ø36.5、左轴端至 Ø31.5（齿轮位左轴肩朝左，只能在这次安装中车出）, tool: T01, op: turn,
         passes_detail: [[50, 2.125, 42], [45.75, 2.125, 42], [41.5, 2.5, 53.2], [36.5, 2.5, 41.2]], vc: 120, f: 0.3, gauge: G03}
    inspect:
      - {char: 总长 168±0.2, gauge: G02, freq: 首件、每 10 件}
      - {char: 各外圆 Ø31.5、Ø36.5、Ø41.5（0/−0.25）, gauge: G03, freq: 首件、每 10 件}
      - {char: 中心孔 A3.15 完整、无毛刺, gauge: 目测, freq: 每件}
