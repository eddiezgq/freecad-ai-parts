     specific_heat_j_per_kg_k: 515, thermal_expansion_per_k: 1.25e-5, src: ["1348", TH-CI], note: 箱体、轮毂；无缺口疲劳极限，S-N 斜率缺数据}
  - {id: 6061-T6, name: 6061-T6 铝合金, elastic_modulus_mpa: 68900, poisson_ratio: 0.33, density_kg_m3: 2700,
