     thermal_expansion_per_k: 1.20e-5, src: ["1591", HB, TH-ASM], note: 焊接结构、机架；GB/T 1591 不给疲劳值，疲劳计算缺数据}
  - {id: HT200, name: HT200 灰铸铁, poisson_ratio: 0.26, density_kg_m3: 7200, ultimate_strength_mpa: 200, brittle: true,
     thermal_conductivity_w_per_m_k: 50.0, specific_heat_j_per_kg_k: 460, thermal_expansion_per_k: 1.05e-5,
     src: ["9439", HB, TH-CI], note: 脆性材料，安全系数按抗拉强度；标准只给弹性模量区间，没有单值，强度计算缺数据}
  - {id: QT500-7, name: QT500-7 球墨铸铁, elastic_modulus_mpa: 169000, poisson_ratio: 0.275, density_kg_m3: 7100,
