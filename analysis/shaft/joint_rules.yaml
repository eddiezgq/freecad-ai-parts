# 机器人关节输出空心轴的结构规则（ADR-0100 42.5）。只收有出处的规则与数值。
title: 关节空心轴结构规则
structure:
  source: "问渠《机械设计》33.10（RJ-201）：减速器法兰与轴一体；两个轴承装在连续的轴承位上、中间隔套；外端渐开线花键传转矩给大臂法兰；最外端圆螺母压紧；两个轴承都从大臂一端装入"
  flange_extra_mm: 20          # 减速器法兰外径 = 轴承位 + 20 mm（书中结构；有减速器输出法兰数据时以数据为准）
  flange_length_mm: 10
  spacer_length_mm: 24         # 两轴承之间的隔套
  spline_length_mm: 20         # 花键长 = 大臂法兰毂长
  thread_length_mm: 10
spline:
  source: "GB/T 3478.1 圆柱直齿渐开线花键（30° 平齿根）；齿数取法与书中 33.10 相同：花键大径要比轴承内径小，轴承才能从这一端装入"
  module_mm: 1.5
  # 齿数 z = floor((轴承位 − 3)/m) − 1；分度圆 d = m·z；外花键大径 D_ee = m(z + 1)；小径 D_ie = m(z − 1.5)
  allowable_bearing_pressure_mpa: 80
  allowable_source: "花键静连接齿面挤压许用应力：齿面未经热处理、使用和制造情况中等，60–100 MPa 取中值（问渠《机械设计》第 25 章，33.10 同）"
  load_factor_psi: 0.75        # 载荷不均匀系数 ψ（同上）
lock_nut:
  source: "GB/T 812 圆螺母的细牙螺纹（螺距 1.5）；取比花键小径小 0.5 mm 以上的最大一档（书中 33.10）"
  threads_mm: [30, 33, 36, 39, 42, 45, 48]
stiffness:
  source: "书中 33.10：J2 输出轴扭转使末端偏移，系统分给它的预算 0.20 mm（峰值力矩下）；手算只计各段扭转、不计台阶法兰局部变形，选型留 1.2 倍"
  hand_margin: 1.2
