name: AI 起草算例与报告解释验收（手动运行）

# ADR-0093 补充十一第 4 步：在云端用真实 LLM 跑六个真实零件样例，量面选对率（门槛：面选错 ≤ 10 %），并录制。
# 密钥用仓库 demo 环境里已有的 ANTHROPIC_API_KEY（与“真实数据”工作流同一个），不经过对话、不写进仓库。
# 结果写在本次运行的摘要里；录制推到新分支 m38/fea-draft-rec-<运行号>，由人或 Claude 开 PR 合并。约 13 次模型调用（起草 10 次、解释 3 次）。
# ADR-0096 第 2 步：provider 选 deepseek 时经模型网关只用 DeepSeek（密钥 DEEPSEEK_API_KEY，同在 demo 环境），门槛与 Claude 相同。

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "用哪家模型（claude / deepseek）"
        required: true
        default: claude
        type: choice
        options: [claude, deepseek]

permissions:
  contents: write

concurrency:
  group: fea-draft-eval
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: demo
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PROVIDER: ${{ inputs.provider || 'claude' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: gmsh 所需系统库
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgomp1
      - name: 安装依赖
        run: pip install -e ".[dev,llm,fea,report]"
      - name: 没有密钥时停止
        run: |
          if [ "$PROVIDER" = deepseek ]; then k="$DEEPSEEK_API_KEY"; n=DEEPSEEK_API_KEY; else k="$ANTHROPIC_API_KEY"; n=ANTHROPIC_API_KEY; fi
          if [ -z "$k" ]; then echo "::error::demo 环境中没有 $n" ; echo "demo 环境中没有 $n" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "用 $PROVIDER（$n 已配置）" >> "$GITHUB_STEP_SUMMARY"
      - name: 跑样例并录制
        run: |
          set +e
          python -m assist.fea_draft eval --record --provider "$PROVIDER" > eval.json
          code=$?
          set -e
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("eval.json"))
          import os
          print(f"## AI 起草算例验收（{os.environ['PROVIDER']}）\n")
          print(f"- 结论：{'达标' if r['passed'] else '未达标'}")
          print(f"- 面选错率：{r['face_error_rate']:.0%}（门槛 ≤ 10 %，共 {r['items']} 项）")
          q = r["question_hit_rate"]
          print(f"- 该问的问到：{'—' if q is None else f'{q:.0%}'}")
          print(f"- 起草最慢一份（不含模型）：{r['max_local_s']:.1f} s\n")
          print("| 样例 | 应有 | 对 | 面错 | 漏 | 数错 | 追问 | 分析步 | 未采用 |")
          print("|---|---|---|---|---|---|---|---|---|")
          for x in r["samples"]:
              print(f"| {x['id']} | {x['expected']} | {x['right']} | {x['wrong_face']} | {x['missing']} | {x['wrong_value']} "
                    f"| {x['questions_hit']}/{x['questions_expected']} | {'对' if x['steps_ok'] else '错'} | {x['rejected']} |")
          EOF
          cat eval.json
          echo "评测退出码 $code（1 = 未达标；录制照样提交，便于分析）"
      - name: 报告解释（真实零件的结果）并录制
        run: |
          set +e
          python -m assist.fea explain-eval --record --provider "$PROVIDER" > explain.json
          code=$?
          set -e
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("explain.json"))
          print("\n## 报告解释验收\n")
          print(f"- 结论：{'达标' if r['passed'] else '未达标'}（每份都有采用的段落、用了占位符、没有退回的段落）\n")
          print("| 结果 | 采用段落 | 占位符 | 退回 |")
          print("|---|---|---|---|")
          for x in r["samples"]:
              why = "；".join(f"{y['part']}：{y['reason']}" for y in x["rejected"]) or "—"
              print(f"| {x['id']} | {x['kept']} | {x['placeholders']} | {why} |")
          EOF
          cat explain.json
          echo "解释评测退出码 $code"
      - name: 推到新分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="m38/fea-draft-rec-${PROVIDER}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A tests/recordings
          if git diff --cached --quiet; then echo "没有新录制"; exit 0; fi
          git commit -m "M38: AI 起草算例录制（运行 ${GITHUB_RUN_ID}）" -m "由 .github/workflows/fea-draft-eval.yml 生成"
          git push origin "$branch"
          echo "录制已推到分支 $branch" >> "$GITHUB_STEP_SUMMARY"
