          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${{ github.repository }}"
      - name: 缓存 FreeCAD 便携版
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\fap-win\FreeCAD_1.0.2-conda-Windows-x86_64-py311.7z
          key: freecad-win-1.0.2
      - name: 生成问渠有限元安装包（测试版）
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\build.ps1 -Work "%RUNNER_TEMP%\fap-win" -Out dist -Edition fea -TestBuild > "%RUNNER_TEMP%\build.log" 2>&1
          set rc=%ERRORLEVEL%
          type "%RUNNER_TEMP%\build.log"
          exit /b %rc%
      - name: 静默安装、免费版与专业版验收、卸载
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\accept_fea.ps1 -Dist dist -Dir C:\wq-fea-test > "%RUNNER_TEMP%\build.log" 2>&1
          set rc=%ERRORLEVEL%
