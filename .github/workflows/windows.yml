name: Windows 安装包

# 企业单机安装版（ADR-0066）：在 GitHub 的 Windows 机器上取 FreeCAD 1.0.2 便携版、装依赖与工作台、打 Inno Setup 安装包。
# 只在安装包相关文件有改动的 PR、每晚（main 有新提交时）或手动时跑（ADR-0067）；main 上把安装包传到 Release windows-installer。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "47 7 * * *"          # 每晚一次全量（ADR-0067）；main 没有新提交时不跑
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # 这次跑哪些作业（ADR-0067）：私有仓库按分钟计费，重作业只在相关目录有改动、每晚或手动时跑
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read          # 查上次成功的定时运行
    outputs:
      light: ${{ steps.s.outputs.light }}
      factory: ${{ steps.s.outputs.factory }}
      deploy: ${{ steps.s.outputs.deploy }}
      windows: ${{ steps.s.outputs.windows }}
      gui: ${{ steps.s.outputs.gui }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: s
        env:
          WF: windows.yml
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci_scope.sh

  windows-installer:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: 检出（不含 factory/）
        # factory/designs 里有 Windows 不允许的文件名（aux.kicad_sch），actions/checkout 整个失败（2026-11-17 发现）；
        # 安装包用不到 factory/：关掉 NTFS 路径检查，稀疏检出时不写这些文件
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config core.protectNTFS false
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          git sparse-checkout set --no-cone '/*' '!/factory/'
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${{ github.repository }}"
      - name: 缓存 FreeCAD 便携版
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\fap-win\FreeCAD_1.0.2-conda-Windows-x86_64-py311.7z
          key: freecad-win-1.0.2
      - name: 生成安装包
        # 用 Windows PowerShell 5.1（企业电脑上默认的那个）跑，确认脚本在它上面能用
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\build.ps1 -Work "%RUNNER_TEMP%\fap-win" -Out dist > "%RUNNER_TEMP%\build.log" 2>&1
          set rc=%ERRORLEVEL%
          type "%RUNNER_TEMP%\build.log"
          exit /b %rc%
      - name: 静默安装、验收、卸载（ADR-0066 第 4 项）
        # 脚本放在带 BOM 的 .ps1 里：Windows PowerShell 5.1 读 Actions 生成的无 BOM 临时脚本时中文会乱码
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\accept.ps1 -Dist dist -Dir C:\fap-test > "%RUNNER_TEMP%\build.log" 2>&1
          set rc=%ERRORLEVEL%
          type "%RUNNER_TEMP%\build.log"
          exit /b %rc%
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist\*.exe
          retention-days: 7
      - name: 合并到 main 后发布安装包
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-installer >/dev/null 2>&1 || gh release create windows-installer \
            --title "Windows 单机安装版" --notes "CI 自动生成（ADR-0066）：FreeCAD 1.0.2 + AI Parts 工作台 + 分析模块。" --prerelease
          gh release upload windows-installer dist/*.exe --clobber
      - name: 失败时的输出（写成注释）
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          # 一个步骤最多显示 10 条注释，所以把尾部 40 行并成一条
          echo "::error::$(tail -n 40 "$RUNNER_TEMP/build.log" | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"

  windows-gui:
    # Windows + FreeCAD 1.1（Qt 6，与问渠 CAD 1.1.4 同一代）里真的打开界面（ADR-0100 42.4 之三）：
    # 2026-11-19 AI 设计面板在问渠 CAD 1.1.4 里卡死，Linux 的 FreeCAD 1.0.2 / 1.1 都重现不出来。用 conda-forge 编译好的 FreeCAD，不从源码编译；
    # 只在界面代码有改动的 PR、每晚或手动时跑（按 2 倍计费，一次约 10 分钟）
    needs: scope
    if: needs.scope.outputs.gui == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: 检出（不含 factory/）
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config core.protectNTFS false
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          git sparse-checkout set --no-cone '/*' '!/factory/'
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${{ github.repository }}"
      - name: FreeCAD 1.1（conda-forge 编译好的）
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc11
          create-args: freecad=1.1.3 python=3.12 pip
          cache-environment: true
          cache-environment-key: freecad-1.1.3-py312-win
      - name: 依赖与工作台
        shell: pwsh
        run: |
          micromamba run -n fc11 python -m pip install -q ".[llm]"
          foreach ($m in @("$env:APPDATA\FreeCAD\Mod", "$env:APPDATA\FreeCAD\v1-1\Mod")) { micromamba run -n fc11 python -m freecad_addon.install --mod-dir $m }
      - name: 打开 AI 设计面板（中、英文 × 普通 / 比屏幕宽）
        shell: pwsh
        run: |
          $prefix = (micromamba run -n fc11 python -c "import sys; print(sys.prefix)").Trim()
          $exe = Join-Path $prefix "Library\bin\freecad.exe"
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem -Recurse $prefix -Filter freecad.exe | Select-Object -First 1).FullName }
          Write-Host "FreeCAD：$exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\gui\run_gui_matrix.ps1 -FreeCAD $exe -Out gui-out
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui
          path: gui-out
          retention-days: 7

  wenquest-fea:
    # 问渠有限元安装包（ADR-0096 第 5 步）：验收用的测试版（-TestBuild，认 CI 临时生成的测试授权公钥），只作 CI 产物，不发布
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: 检出（不含 factory/）
