name: 镜像

# 企业安装版用的预构建镜像（ADR-0063，M15 第 3 项）：合并到 main（工厂、计算内核有改动）或打版本标签时，
# 构建工厂、桥接、虚拟 PLC 三个镜像，推到 GitHub 容器仓库。企业安装直接拉取，不在现场构建。镜像里不含密钥与企业数据。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "factory/digital/**"
      - "analysis/**"
      - "kb/**"
      - "schema/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fap-factory
            context: .
            file: factory/digital/Dockerfile
          - name: fap-bridge
            context: factory/digital/bridge
            file: factory/digital/bridge/Dockerfile
          - name: fap-openplc
            context: factory/digital
            file: factory/digital/openplc/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像名与标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=问渠数字工厂企业安装版（ADR-0063）
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            HELP_VIDEOS_STAMP=${{ github.sha }}
