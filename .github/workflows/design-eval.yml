name: AI 设计阶梯轴验收（手动运行）

# ADR-0100 42.2：用真实模型设计平缝机上轴（examples/ai-design/ls-upper-shaft），代码校核，最多 4 轮；录制推到新分支
# m42/design-rec-<provider>-<运行号>，由人或 Claude 开 PR 合并。密钥用仓库 demo 环境里已有的，不经过对话、不写进仓库。
# 台阶的应力集中系数用有限元算（CalculiX），每种台阶约 40 秒。

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "用哪家模型（claude / deepseek）"
        required: true
        default: claude
        type: choice
        options: [claude, deepseek]

permissions:
  contents: write

concurrency:
  group: design-eval
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: demo
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PROVIDER: ${{ inputs.provider || 'claude' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: CalculiX 与 gmsh 所需系统库
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 libgomp1
      - name: 安装依赖
        run: pip install -e ".[dev,llm,fea]"
      - name: 设计并录制
        run: |
          set +e
          python -m assist.design examples/ai-design/ls-upper-shaft/requirement.txt --record --provider "$PROVIDER" -o result.json 2> log.txt
          code=$?
          set -e
          { echo "## AI 设计平缝机上轴（$PROVIDER）"; echo; echo '```'; cat log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat log.txt
          echo "退出码 $code（1 = 没有通过；录制照样提交，便于分析）"
      - name: 推到新分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="m42/design-rec-${PROVIDER}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A tests/recordings/design
          if git diff --cached --quiet; then echo "没有新录制"; exit 0; fi
          git commit -m "M42: AI 设计阶梯轴录制（运行 ${GITHUB_RUN_ID}）" -m "由 .github/workflows/design-eval.yml 生成"
          git push origin "$branch"
          echo "录制已推到分支 $branch" >> "$GITHUB_STEP_SUMMARY"
