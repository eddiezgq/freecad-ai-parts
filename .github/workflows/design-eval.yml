name: AI 设计阶梯轴验收（手动运行）

# ADR-0100 42.2：用真实模型设计平缝机上轴（examples/ai-design/ls-upper-shaft），代码校核，最多 4 轮；录制推到新分支
# m42/design-rec-<provider>-<运行号>，由人或 Claude 开 PR 合并。密钥用仓库 demo 环境里已有的，不经过对话、不写进仓库。
# 台阶的应力集中系数用有限元算（CalculiX），每种台阶约 40 秒。

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "用哪家模型（claude / deepseek）"
        required: true
        default: claude
        type: choice
        options: [claude, deepseek]
      part:
        description: "设计哪个零件（shaft = 平缝机上轴；joint = 机器人关节空心轴，ADR-0100 42.5；robot = 整机构型，ADR-0115 44.2；robot-b = 案例 B 裁片上下料的构型初筛，44.5.1）"
        required: true
        default: shaft
        type: choice
        options: [shaft, joint, robot, robot-b]

permissions:
  contents: write

concurrency:
  group: design-eval
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: demo
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PROVIDER: ${{ inputs.provider || 'claude' }}
      PART: ${{ inputs.part || 'shaft' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: CalculiX 与 gmsh 所需系统库
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 libgomp1
      - name: 安装依赖
        run: pip install -e ".[dev,llm,fea,mbd]"
      - name: 设计并录制
        run: |
          set +e
          if [ "$PART" = robot-b ]; then
            python -m assist.robot_design examples/robots/sewing-loader/requirement.txt --record --provider "$PROVIDER" --screen-only -o result.json 2> log.txt
          elif [ "$PART" = robot ]; then
            python -m assist.robot_design examples/robots/teaching-arm/requirement.txt --record --provider "$PROVIDER" -o result.json 2> log.txt
          elif [ "$PART" = joint ]; then
            python -m assist.joint_design examples/ai-design/cobot-j2/requirement.txt --record --provider "$PROVIDER" -o result.json 2> log.txt
          else
            python -m assist.design examples/ai-design/ls-upper-shaft/requirement.txt --record --provider "$PROVIDER" -o result.json 2> log.txt
          fi
          code=$?
          set -e
          { echo "## AI 设计 $PART（$PROVIDER）"; echo; echo '```'; cat log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat log.txt
          echo "退出码 $code（1 = 没有通过；录制照样提交，便于分析）"
      - name: 推到新分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="m42/design-rec-${PART}-${PROVIDER}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          for d in tests/recordings/design tests/recordings/joint_design tests/recordings/robot_design; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --cached --quiet; then echo "没有新录制"; exit 0; fi
          git commit -m "M42: AI 设计阶梯轴录制（运行 ${GITHUB_RUN_ID}）" -m "由 .github/workflows/design-eval.yml 生成"
          git push origin "$branch"
          echo "录制已推到分支 $branch" >> "$GITHUB_STEP_SUMMARY"
