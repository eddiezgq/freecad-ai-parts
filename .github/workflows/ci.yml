name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 7 * * *"          # 每晚一次全量（ADR-0067）；main 没有新提交时不跑
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # 这次跑哪些作业（ADR-0067）：私有仓库按分钟计费，重作业只在相关目录有改动、每晚或手动时跑
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read          # 查上次成功的定时运行
    outputs:
      light: ${{ steps.s.outputs.light }}
      factory: ${{ steps.s.outputs.factory }}
      deploy: ${{ steps.s.outputs.deploy }}
      windows: ${{ steps.s.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: s
        env:
          WF: ci.yml
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci_scope.sh

  test:
    needs: scope
    if: needs.scope.outputs.light == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fap_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装字体（模拟规格书 PDF 用）、CalculiX（分析模块，ADR-0056）与 OpenFOAM（流体，ADR-0059）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-wqy-zenhei calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 libgomp1 openfoam openmpi-bin
      - name: 安装依赖
        run: pip install -e ".[dev,mbd,fea,optimize]"
      - name: 代码检查
        run: python -m ruff check .
      - name: schema 校验、单元测试与数据库测试
        run: |
          set -o pipefail
          python -m pytest -v -rf 2>&1 | tee unit-tests.log
      - name: 失败摘要写成注解
        if: failure()
        run: grep -E "^(FAILED|ERROR) |^E  " unit-tests.log | head -40 | sed 's/^/::error::/' || true

  freecad:
    # FreeCAD 相关测试（ADR-0032）：锁定 FreeCAD 1.0.2 AppImage，用其内带 Python 运行 pytest -m freecad
    needs: scope
    if: needs.scope.outputs.light == 'true'
    runs-on: ubuntu-24.04
    env:
      FAP_REQUIRE_FREECAD: "1"
    steps:
      - uses: actions/checkout@v5
      - name: 缓存 FreeCAD AppImage
        uses: actions/cache@v4
        with:
          path: .freecad/FreeCAD_1.0.2-conda-Linux-x86_64-py311.AppImage
          key: freecad-1.0.2-e00be00ad9fdb12b
      - name: 获取并解包 FreeCAD（核对 SHA-256）
        run: echo "FC=$(scripts/fetch_freecad.sh .freecad)" >> "$GITHUB_ENV"
      - name: 安装 Xvfb（截图测试用）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: 在 FreeCAD 内带 Python 中安装本项目
        run: '"$FC/usr/bin/python" -m pip install -e ".[dev,mbd,fea,optimize]"'
      - name: FreeCAD 测试
        run: |
          set -o pipefail
          PYTHONPATH="$FC/usr/lib" xvfb-run -a -s "-screen 0 1280x1024x24" "$FC/usr/bin/python" -m pytest -m freecad -v -rf 2>&1 | tee freecad-tests.log
      - name: 失败摘要写成注解（便于在检查结果中直接看到原因）
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) |^E  " freecad-tests.log | head -40 | sed 's/^/::error::/' || true
          # 进程崩溃时没有 FAILED 行：把日志尾部并成一条注释（一个步骤最多显示 10 条）
          echo "::error::日志尾部%0A$(tail -n 30 freecad-tests.log | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"

  factory:
    # 搬入的数字工厂（ADR-0058）：独立子项目，沿用问渠仓库 factory 工作流的测试作业
    needs: scope
    if: needs.scope.outputs.factory == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 有限元、流体求解器（CalculiX、gmsh 所需系统库、OpenFOAM）
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 openfoam openmpi-bin
          (ccx -v || true) | grep -q Version
          which simpleFoam snappyHexMesh mpirun
      - name: 动力学用的机器人模型（Menagerie 固定提交）
        run: sh factory/deploy/fetch_menagerie.sh "$RUNNER_TEMP/menagerie" && echo "WQ_MENAGERIE=$RUNNER_TEMP/menagerie" >> "$GITHUB_ENV"
      - name: 工厂数据与导入脚本
        working-directory: factory
        run: pip install -q -r digital/requirements.txt pytest "requests>=2.31" matplotlib && python -m pytest -q tests
      - name: 独立的 G 代码解析器（只装在测试环境）
        run: |
          pip install -q --no-deps pygcode==0.2.1 six
          pip download -q --no-deps --no-binary :all: euclid3==0.01 -d "$RUNNER_TEMP/eu"
          tar -xzf "$RUNNER_TEMP/eu/euclid3-0.01.tar.gz" -C "$RUNNER_TEMP/eu"
          cp "$RUNNER_TEMP/eu/euclid3-0.01/euclid3.py" "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/"
          python -c "import pygcode"
      - name: 总线、仿真、枢纽、计算服务
        working-directory: factory/digital
        env:
          # 计算内核只留 analysis/ 一份（ADR-0060），工厂的 cae/ 是转接层
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/pytest.log
          st=${PIPESTATUS[0]}
          if [ "$st" != 0 ]; then python3 ../deploy/ci_annotate.py 单元测试 /tmp/pytest.log 120; fi
          exit "$st"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 工作台网页能打包
        working-directory: factory/digital/web
        run: npm ci --no-audit --no-fund && npm run build

  factory-local:
    # 本地版能一条命令启动（ADR-0058，M10 第 6b 项）：构建镜像、启动、枢纽健康、仿真车间有数据进总线
    runs-on: ubuntu-24.04
    needs: [scope, factory]
    if: needs.scope.outputs.deploy == 'true'
    permissions:
      contents: write          # 合并到 main 后把帮助视频传到 Release（ADR-0065）
    steps:
      - uses: actions/checkout@v5
      - name: 启动本地工厂
        run: factory/local/start.sh
      - name: 枢纽健康、总线已连、仿真车间在发数据
        run: |
          for i in $(seq 1 60); do
            h=$(curl -fsS http://localhost:8100/api/health || true)
            echo "$h"
            python3 - "$h" <<'PY' && exit 0
          import json, sys
          h = json.loads(sys.argv[1] or "{}")
          sys.exit(0 if h.get("ok") and h.get("bus") and h.get("messages", 0) > 0 else 1)
          PY
            sleep 5
          done
          exit 1
      - name: 网页与“本地版”标识
        run: |
          curl -fsS http://localhost:8100/ | grep -q "<div id=\"app\"" || curl -fsS http://localhost:8100/ | head -20
          curl -fsS http://localhost:8100/api/config | python3 -c "import json,sys; assert json.load(sys.stdin)['edition']=='local'"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: FreeCAD 一侧发布到工厂（M10 第 6c 项）：真枢纽存下方案并列出
        run: |
          pip install -q -e .
          python - <<'PY'
          from freecad_addon.core import factory_link as F
          from kb.library import JsonLibrary
          lib = JsonLibrary("data/library")
          layout = {"instances": [{"instance": "motor", "component": "servo_motor.yaskawa-electric-corporation.sgm7j-02a-6"},
                                  {"instance": "reducer", "component": "reducer.harmonic-drive-llc.csf-25-100-2uh"}],
                    "connections": []}
          data = F.payload(layout, lib.get, code="CI-JOINT", name="CI 关节方案")
          c = F.HubClient("http://localhost:8100")
          r1 = F.publish(c, "CI", "teach", data)
          r2 = F.publish(c, "CI", "teach", {**data, "note": "第二版"})
          assert (r1["revision"], r2["revision"]) == (1, 2), (r1, r2)
          lst = c._req("/api/cad/designs")
          d = c._req("/api/cad/designs/CI-JOINT")
          assert lst[0]["code"] == "CI-JOINT" and d["revision"] == 2 and len(d["bom"]) == 2, (lst, d)
          print("发布到工厂：", r1, r2)
          PY
      - name: 工厂读本仓库零件库、孪生记录导出给 FreeCAD（M10 第 6d 项）
        run: |
          python - <<'PY'
          import tempfile, time, urllib.request
          from freecad_addon.core import factory_link as F
          from analysis import twin
          c = F.HubClient("http://localhost:8100")
          c.login("CI", "teach")
          r = c._req("/api/fap/components?category=reducer&q=csf%2025")
          ids = [i["id"] for i in r["items"]]
          assert "reducer.harmonic-drive-llc.csf-25-100-2uh" in ids, ids
          comp = c._req("/api/fap/components/reducer.harmonic-drive-llc.csf-25-100-2uh")
          assert comp["library"] == "public" and comp["params"], comp
          rows, deadline = [], time.time() + 240
          while not rows and time.time() < deadline:
              units = c._req("/api/twin/fleet")["units"]
              for u in units:
                  req = urllib.request.Request(f"http://localhost:8100/api/twin/units/{u['serial']}/records.csv?instance=j2",
                                               headers={"x-wq-token": c.token})
                  try:
                      text = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
                  except urllib.error.HTTPError:
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".csv", delete=False, encoding="utf-8") as f:
                      f.write(text)
                  rows = twin.read_csv(f.name)
                  if rows:
                      break
              if not rows:
                  time.sleep(10)
          assert rows and rows[0]["instance"] == "j2" and rows[0]["hours"] > 0, rows
          print("零件库：", len(r["items"]), "个减速器；孪生记录：", len(rows), "行，例", rows[0])
          PY
      - name: 计算服务用本仓库 analysis/ 的内核（M12，ADR-0060）
        run: |
          cd factory/digital
          docker compose --profile mock exec -T cae python - <<'PY'
          import urllib.request
          import analysis
          from analysis.cfd import foam
          from cae import cfd, cfd_bench
          assert analysis.__file__.startswith("/app/fap/"), analysis.__file__
          assert foam.find_openfoam(), "镜像里没有 OpenFOAM"
          assert cfd.solve.__module__ == "cae.cfd" and cfd.wall_forces.__module__ == "analysis.cfd.solver"
          assert urllib.request.urlopen("http://localhost:8200/health", timeout=10).status == 200
          r = cfd_bench.poiseuille("/tmp/poiseuille")
          assert abs(r["error"]) < 0.03, r
          print("计算服务：analysis 在", analysis.__file__, "；Poiseuille 误差", round(r["error"], 4))
          PY
      - name: 典型应用发布到工厂并走完工厂一侧（M13，ADR-0061）
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 libgomp1
          pip install -q -e ".[mbd,fea]"
          set -o pipefail
          { python -m examples.apps.lockstitch --quick --no-cfd --hub http://localhost:8100 &&
            python -m examples.apps.factory_flow --hub http://localhost:8100 --erp http://localhost:8091 --products LOCKSTITCH-DD --speed 240; } 2>&1 \
            | tee "$RUNNER_TEMP/apps.log"
      - name: 录教学版帮助视频（ADR-0065）：脚本在演示工厂里操作并录下，字幕叠在画面上
        run: |
          pip install -q playwright==1.55.0 && python -m playwright install --with-deps chromium >/dev/null
          set -o pipefail
          python factory/digital/tools/help_videos.py --hub http://localhost:8100 --edition teach --out help-media 2>&1 \
            | tee "$RUNNER_TEMP/videos.log"
          tar czf help-videos-teach.tar.gz -C help-media . && ls -la help-media
      - uses: actions/upload-artifact@v4
        with:
          name: help-videos-teach
          path: help-videos-teach.tar.gz
      - name: 合并到 main 后发布帮助视频（教学版）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view help-videos >/dev/null 2>&1 || gh release create help-videos --title "帮助的操作视频" \
            --notes "CI 自动录制（ADR-0065），工厂镜像构建时取用。" --prerelease
          gh release upload help-videos help-videos-teach.tar.gz --clobber
      - name: 视频没录成时的输出（写成注释）
        if: failure()
        run: '[ ! -f "$RUNNER_TEMP/videos.log" ] || python3 factory/deploy/ci_annotate.py 录视频 "$RUNNER_TEMP/videos.log" 60'
      - name: 失败时的日志
        if: failure()
        run: |
          [ ! -f "$RUNNER_TEMP/apps.log" ] || python3 factory/deploy/ci_annotate.py 演练输出 "$RUNNER_TEMP/apps.log" 80
          cd factory/digital && docker compose --profile mock ps && docker compose --profile mock logs --no-color --tail 80 2>&1 | tee "$RUNNER_TEMP/svc.log"
          python3 ../deploy/ci_annotate.py 服务日志 "$RUNNER_TEMP/svc.log" 120
      - name: 停止
        if: always()
        run: factory/local/stop.sh --reset

  enterprise:
    # 企业安装版（ADR-0063，M15）：干净机器上一条命令装好（自签证书、本机域名），企业账号登录，工作台与 ERPNext 经 HTTPS 可开
    # M16（ADR-0064）：装的是示例企业工厂（示例缝纫机厂，人民币、上海时区、自己的设备与平面），不是演示工厂
    permissions:
      contents: write          # 合并到 main 后把帮助视频传到 Release（ADR-0065）
    runs-on: ubuntu-24.04
    needs: [scope, factory]
    if: needs.scope.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: 腾出磁盘（ERPNext 与工厂镜像要十几 GB）
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: 构建镜像（与发布到 GHCR 的同一份 Dockerfile；这里不推送）
        run: |
          docker build -q -f factory/digital/Dockerfile -t fap-factory:ci .
          docker build -q -t fap-bridge:ci factory/digital/bridge
      - name: 一条命令安装
        env:
          FAP_DIR: ${{ runner.temp }}/fap
          FAP_FACTORY_IMAGE: fap-factory:ci
          FAP_BRIDGE_IMAGE: fap-bridge:ci
          FAP_ADMIN_PASSWORD: Ci-admin-pass-2026
          FAP_MIN_DISK_GB: "8"              # CI 机器的磁盘小；企业服务器仍按 40 GB 检查
        run: |
          set -o pipefail
          mkdir -p "$FAP_DIR" && cp -r factory/enterprise/. "$FAP_DIR/" && cp -r data/library "$FAP_DIR/library"
          "$FAP_DIR/install.sh" --domain factory.localtest.me --tls-internal --admin admin --no-pull --demo --region cn \
            --plant factory/plants/example-sewing.yaml 2>&1 \
            | tee "$RUNNER_TEMP/install.log"
      - name: HTTPS、企业账号登录、ERPNext、状态
        env:
          FAP_DIR: ${{ runner.temp }}/fap
        run: |
          exec > >(tee "$RUNNER_TEMP/check.log") 2>&1     # 失败时写成注释
          set -x
          R="--resolve factory.localtest.me:443:127.0.0.1 --resolve erp.factory.localtest.me:443:127.0.0.1"
          curl -fsk $R https://factory.localtest.me/api/login/info | python3 -c "import json,sys; assert json.load(sys.stdin)['auth']=='enterprise'"
          code=$(curl -sk $R -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d '{"name":"x","role":"manager"}' https://factory.localtest.me/api/login)
          [ "$code" = 401 ] || { echo "填名字竟然能登录：$code"; exit 1; }
          tok=$(curl -fsk $R -H 'content-type: application/json' -d '{"username":"admin","password":"Ci-admin-pass-2026"}' \
                https://factory.localtest.me/api/login | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          curl -fsk $R -H "x-wq-token: $tok" https://factory.localtest.me/api/admin/ai | python3 -c "
          import json,sys; s=json.load(sys.stdin); assert s['region']=='cn' and s['preferred']=='deepseek', s; print('AI：', s)"
          curl -fsk $R https://erp.factory.localtest.me/api/method/ping
          # 工厂清单（ADR-0064）：ERPNext 的公司与币种、工作台的厂名与车间设备都按示例缝纫机厂
          erp() { docker compose -p fap --env-file "$FAP_DIR/.env" -f "$FAP_DIR/docker-compose.yml" exec -T erp-backend \
                  bench --site frontend execute "$@"; }
          erp frappe.db.get_value --args "['Company', '示例缝纫机厂', 'default_currency']" | tail -n 1 | tee cur.txt
          grep -q CNY cur.txt
          # bench execute 的输出末行是返回值（前面可能有警告）；取最后一个数
          count() { erp frappe.db.count --args "['$1']" 2>/dev/null | python3 -c "
          import re,sys; t=sys.stdin.read(); n=re.findall(r'\\d+', t); print(n[-1] if n else 0)"; }   # 返回 0 时 bench 什么也不打印
          ws=$(count Workstation); items=$(count Item); echo "工作站 $ws，物料 $items"
          [ "$ws" = 8 ]
          [ "$items" -lt 20 ]                      # 不装演示物料
          curl -fsk $R -H "x-wq-token: $tok" https://factory.localtest.me/api/config | python3 -c "
          import json,sys; p=json.load(sys.stdin)['plant']; assert p['name']=='示例缝纫机厂' and not p['demo'], p; print('工厂：', p)"
          curl -fsk $R -H "x-wq-token: $tok" https://factory.localtest.me/api/layout | python3 -c "
          import json,sys; L=json.load(sys.stdin); ids=set(L['units'])
          assert 'lathe-1' in ids and 'cnc-l01-a' not in ids, ids; print('设备：', sorted(ids))"
          "$FAP_DIR/status.sh"
          ls "$FAP_DIR"/backups/fap-*.tar.gz && ls "$FAP_DIR"/gateway-bundle/
      - name: 现场网关：上行数据到云端总线，下行指令到车间（ADR-0063）
        env:
          FAP_DIR: ${{ runner.temp }}/fap
          GW: ${{ runner.temp }}/gw
        run: |
          mkdir -p "$GW" && cp -r factory/gateway/. "$GW/" && cp "$FAP_DIR"/gateway-bundle/* "$GW/"
          (cd "$GW" && sudo FAP_CLOUD_IP=host-gateway ./start.sh)
          hubpw=$(grep '^WQ_MQTT_HUB_PASSWORD=' "$FAP_DIR/.env" | cut -d= -f2-)
          cloud() { docker compose -p fap --env-file "$FAP_DIR/.env" -f "$FAP_DIR/docker-compose.yml" exec -T bus "$@"; }
          gw() { docker compose -p fap-gateway -f "$GW/docker-compose.yml" exec -T broker "$@"; }
          for i in $(seq 1 30); do docker compose -p fap-gateway -f "$GW/docker-compose.yml" logs broker 2>&1 | grep -q "Connecting bridge" && break; sleep 2; done
          sleep 5
          cloud mosquitto_sub -u hub -P "$hubpw" -t wq/gearbox/machining/ci-gw/status -C 1 -W 40 > up.txt &
          sub=$!; sleep 3
          gw mosquitto_pub -t wq/gearbox/machining/ci-gw/status -m '{"state":"run","by":"gateway"}' -q 1
          wait $sub; cat up.txt; grep -q gateway up.txt
          gw mosquitto_sub -t wq/gearbox/machining/ci-gw/cmd -C 1 -W 40 > down.txt &
          sub=$!; sleep 3
          cloud mosquitto_pub -u hub -P "$hubpw" -t wq/gearbox/machining/ci-gw/cmd -m '{"command":"stop"}' -q 1
          wait $sub; cat down.txt; grep -q stop down.txt
          docker compose -p fap-gateway -f "$GW/docker-compose.yml" logs broker | tail -20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 典型应用发布到企业版工厂（示例缝纫机厂）并走完工厂一侧（M15、M16 验收，ADR-0063、ADR-0064）
        env:
          FAP_DIR: ${{ runner.temp }}/fap
          FAP_FACTORY_USER: admin
          FAP_FACTORY_PASSWORD: Ci-admin-pass-2026
        run: |
          sudo apt-get install -y --no-install-recommends calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1 libgomp1 >/dev/null
          pip install -q -e ".[mbd,fea]"
          docker compose -p fap --env-file "$FAP_DIR/.env" -f "$FAP_DIR/docker-compose.yml" exec -T caddy \
            cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/caddy-root.crt"
          export FAP_FACTORY_CAFILE="$RUNNER_TEMP/caddy-root.crt"
          set -o pipefail
          python -m examples.apps.lockstitch --quick --no-cfd --hub https://factory.localtest.me 2>&1 | tee "$RUNNER_TEMP/apps.log"
          python -m examples.apps.factory_flow --hub https://factory.localtest.me --products LOCKSTITCH-DD --speed 240 2>&1 \
            | tee -a "$RUNNER_TEMP/apps.log"
          grep -q "LOCKSTITCH-DD：设计方案：完成" "$RUNNER_TEMP/apps.log"     # 方案要真的到了工厂，不能“跳过”
      - name: 录企业版帮助视频（ADR-0065）：示例缝纫机厂、企业账号
        env:
          FAP_DIR: ${{ runner.temp }}/fap
          FAP_FACTORY_USER: admin
          FAP_FACTORY_PASSWORD: Ci-admin-pass-2026
        run: |
          pip install -q playwright==1.55.0 && python -m playwright install --with-deps chromium >/dev/null
          # 视频用生产模式录：先以生产模式发布一个方案，“CAD 方案”里才有东西
          FAP_FACTORY_CAFILE="$RUNNER_TEMP/caddy-root.crt" python - <<'PY'
          import os
          from freecad_addon.core import factory_link as F
          from kb.library import JsonLibrary
          lib = JsonLibrary("data/library")
          layout = {"instances": [{"instance": "motor", "component": "servo_motor.yaskawa-electric-corporation.sgm7j-02a-6"},
                                  {"instance": "reducer", "component": "reducer.harmonic-drive-llc.csf-25-100-2uh"}],
                    "connections": []}
          data = F.payload(layout, lib.get, code="SEW-JOINT", name="缝纫机送料关节（示例）")
          c = F.HubClient("https://factory.localtest.me", cafile=os.environ["FAP_FACTORY_CAFILE"])
          print("生产模式发布：", F.publish(c, "admin", "prod", data, password=os.environ["FAP_FACTORY_PASSWORD"]))
          PY
          set -o pipefail
          python factory/digital/tools/help_videos.py --hub https://factory.localtest.me --edition enterprise \
            --cafile "$RUNNER_TEMP/caddy-root.crt" --out help-media 2>&1 | tee "$RUNNER_TEMP/videos.log"
          tar czf help-videos-enterprise.tar.gz -C help-media . && ls -la help-media
      - uses: actions/upload-artifact@v4
        with:
          name: help-videos-enterprise
          path: help-videos-enterprise.tar.gz
      - name: 合并到 main 后发布帮助视频（企业版）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view help-videos >/dev/null 2>&1 || gh release create help-videos --title "帮助的操作视频" \
            --notes "CI 自动录制（ADR-0065），工厂镜像构建时取用。" --prerelease || true
          gh release upload help-videos help-videos-enterprise.tar.gz --clobber
      - name: 失败时的日志（写成注释，经 GitHub 接口能读到）
        if: failure()
        run: |
          cd "${{ runner.temp }}/fap" || exit 0
          python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 安装输出 "$RUNNER_TEMP/install.log" 60
          [ ! -f "$RUNNER_TEMP/check.log" ] || python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 核对输出 "$RUNNER_TEMP/check.log" 60
          docker compose -p fap --env-file .env ps -a > "$RUNNER_TEMP/ps.log" 2>&1 || true
          docker compose -p fap --env-file .env logs --no-color --tail 30 hub caddy bus erp-backend > "$RUNNER_TEMP/svc.log" 2>&1 || true
          python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 服务状态 "$RUNNER_TEMP/ps.log" 40
          python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 服务日志 "$RUNNER_TEMP/svc.log" 160
          docker compose -p fap-gateway logs --no-color --tail 40 > "$RUNNER_TEMP/gw.log" 2>&1 || true
          python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 网关日志 "$RUNNER_TEMP/gw.log" 40
          [ ! -f "$RUNNER_TEMP/apps.log" ] || python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 演练输出 "$RUNNER_TEMP/apps.log" 80
          [ ! -f "$RUNNER_TEMP/videos.log" ] || python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 录视频 "$RUNNER_TEMP/videos.log" 60
          if [ -f "$RUNNER_TEMP/apps.log" ]; then
            grep -E "\[factory_flow\]|Traceback|Error" "$RUNNER_TEMP/apps.log" | cut -c1-300 > "$RUNNER_TEMP/flow.log" || true
            python3 "$GITHUB_WORKSPACE/factory/deploy/ci_annotate.py" 工厂流程 "$RUNNER_TEMP/flow.log" 60
          fi
