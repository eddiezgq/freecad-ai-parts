name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fap_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装字体（模拟规格书 PDF 用）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-wqy-zenhei
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 代码检查
        run: python -m ruff check .
      - name: schema 校验、单元测试与数据库测试
        run: python -m pytest -v
