name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fap_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装字体（模拟规格书 PDF 用）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-wqy-zenhei
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 代码检查
        run: python -m ruff check .
      - name: schema 校验、单元测试与数据库测试
        run: python -m pytest -v

  freecad:
    # FreeCAD 相关测试（ADR-0032）：锁定 FreeCAD 1.0.2 AppImage，用其内带 Python 运行 pytest -m freecad
    runs-on: ubuntu-24.04
    env:
      FAP_REQUIRE_FREECAD: "1"
    steps:
      - uses: actions/checkout@v5
      - name: 缓存 FreeCAD AppImage
        uses: actions/cache@v4
        with:
          path: .freecad/FreeCAD_1.0.2-conda-Linux-x86_64-py311.AppImage
          key: freecad-1.0.2-e00be00ad9fdb12b
      - name: 获取并解包 FreeCAD（核对 SHA-256）
        run: echo "FC=$(scripts/fetch_freecad.sh .freecad)" >> "$GITHUB_ENV"
      - name: 安装 Xvfb（截图测试用）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: 在 FreeCAD 内带 Python 中安装本项目
        run: '"$FC/usr/bin/python" -m pip install -e ".[dev]"'
      - name: FreeCAD 测试
        run: |
          set -o pipefail
          PYTHONPATH="$FC/usr/lib" xvfb-run -a -s "-screen 0 1280x1024x24" "$FC/usr/bin/python" -m pytest -m freecad -v -rf 2>&1 | tee freecad-tests.log
      - name: 失败摘要写成注解（便于在检查结果中直接看到原因）
        if: failure()
        run: grep -E "^(FAILED|ERROR) |^E  " freecad-tests.log | head -40 | sed 's/^/::error::/' || true
