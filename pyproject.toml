[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-ai-parts"
version = "0.0.1"
description = "AI 原生 FreeCAD 与零件产品库：以端口 + 参数 + 包络描述厂商零件，由 AI 选型、校验并装配成系统"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Guoqing (Eddie) Zhang" }]
dependencies = [
    "fastmcp>=2.10",
    "psycopg[binary]>=3.2",
    "pint>=0.24",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "httpx>=0.27",                 # AI 模型网关调 DeepSeek（ADR-0063）
    "cryptography>=42",            # 授权文件的 Ed25519 签名（ADR-0066）
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
# 分析模块（ADR-0056）：按需安装
mbd = [
    "mujoco>=3.2",
]
fea = [
    "gmsh>=4.13",
    "numpy>=1.26",
    "scipy>=1.11",
]
optimize = [
    "optuna>=4.0",
]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
    "ruff>=0.16.9,<0.17",
    "reportlab>=4.2",
    "pyyaml>=6",
]

[project.scripts]
freecad-ai-parts-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["kb*", "ingest*", "engine*", "mcp_server*", "freecad_addon*", "analysis*", "llm_gateway*", "licensing*"]

[tool.setuptools.package-data]
analysis = ["common/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "freecad: 需要 FreeCAD；未安装时跳过，CI 的 freecad 作业中（FAP_REQUIRE_FREECAD=1）不得跳过（ADR-0032）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["factory"]  # 搬入的数字工厂是独立子项目，有自己的测试（ADR-0058）
